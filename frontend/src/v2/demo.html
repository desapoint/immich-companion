<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Immich Companion — V2 Shell Demo</title>
<style>
:root{--bg:#0b1016;--surface:#111821;--surface2:#17202b;--line:#2a3544;--text:#eef3f8;--muted:#91a1b4;--accent:#7ea6ff;--accent2:#243b69;--green:#68d391;--sidebar:228px;--context:268px;--inspector:310px;--top:62px;--r:12px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:8px;padding:8px 11px;cursor:pointer}button:hover{border-color:#4d607a}.primary{background:var(--accent);color:#07111f;border:0;font-weight:800}.app{min-height:100vh;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr)}.sidebar{height:100vh;position:sticky;top:0;display:flex;flex-direction:column;padding:12px 10px;border-right:1px solid var(--line);background:#0e141c}.brand{height:45px;display:flex;align-items:center;gap:10px;padding:0 9px;font-weight:850;font-size:16px}.logo{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,#94b4ff,#746efa)}.nav-label{color:#6e7e92;font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:900;padding:15px 10px 6px}.nav{display:grid;gap:3px}.nav button{height:39px;display:flex;align-items:center;gap:10px;background:transparent;border-color:transparent;color:#adbac9;text-align:left}.nav button:hover{background:#141d28}.nav button.active{background:var(--accent2);color:#e8efff}.ico{width:17px;height:17px;border:1px solid #65758a;border-radius:5px}.grow{flex:1}.connection{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px}.shell{min-width:0;height:100vh;display:grid;grid-template-rows:var(--top) minmax(0,1fr);overflow:hidden}.topbar{height:var(--top);background:rgba(11,16,22,.94);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px}.crumb{color:var(--muted)}.crumb b{color:var(--text)}.top-actions{display:flex;gap:8px;align-items:center}.top-search{width:300px;border:1px solid var(--line);background:#0f151d;color:var(--text);border-radius:8px;padding:8px 10px}.page-host{min-height:0;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}.page-head{background:var(--surface);border-bottom:1px solid var(--line);padding:18px 22px 14px}.head-row{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.title h1{font-size:24px;margin:2px 0 4px}.title p{margin:0;color:var(--muted);max-width:780px}.workspace{display:grid;grid-template-columns:var(--context) minmax(0,1fr) var(--inspector);min-height:0;height:100%;overflow:hidden}.context,.inspector{background:#0f151d;padding:15px;overflow:auto}.context{border-right:1px solid var(--line)}.inspector{border-left:1px solid var(--line)}.content{padding:16px 18px 90px;overflow:auto}.zone{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#9bb9e2;border:1px solid #405978;border-radius:999px;background:#122138;padding:3px 7px;display:inline-block}.section{margin-bottom:14px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.section-title h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#9aaabd}.card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:13px}.card+.card{margin-top:9px}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;gap:8px;align-items:center}.stack{display:grid;gap:8px}.badge{border:1px solid var(--line);border-radius:999px;padding:3px 7px;font-size:11px;color:#bac6d3}.badge.ok{color:#9be5b8;border-color:#315c43}.badge.warn{color:#f5d485;border-color:#66552e}.badge.bad{color:#ffadad;border-color:#673a40}.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric b{font-size:22px;display:block}.metric span{color:var(--muted);font-size:12px}.grid-assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px}.asset{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:linear-gradient(145deg,#28374a,#17202b);position:relative;padding:9px;display:flex;align-items:flex-end}.asset:nth-child(2n){background:linear-gradient(145deg,#344134,#1a2521)}.asset:nth-child(3n){background:linear-gradient(145deg,#443643,#241b26)}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.table th{color:#8fa0b5;font-size:11px;text-transform:uppercase}.notice{padding:10px 12px;border-radius:9px;border:1px solid #405978;background:#122138;color:#cfe0ff;margin-bottom:12px}
@media(max-width:1180px){:root{--inspector:0px}.workspace{grid-template-columns:var(--context) minmax(0,1fr)}.inspector{display:none}.metric-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:880px){:root{--sidebar:68px;--context:0px}.brand span,.nav button span,.nav-label,.connection{display:none}.nav button{justify-content:center}.workspace{display:block}.context{display:none}.top-search{display:none}}
@media(max-width:620px){.app{display:block}.sidebar{display:none}.shell{height:auto;display:block;overflow:visible}.page-host,.workspace{height:auto;display:block;overflow:visible}.content{overflow:visible}.topbar{padding:0 12px}.page-head{padding:14px 12px}.head-row{display:block}.content{padding:12px 10px}.metric-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="logo"></div><span>Immich Companion</span></div>
  <div class="nav-label">Library</div>
  <nav class="nav">
    <button data-page="status"><i class="ico"></i><span>Status</span></button>
    <button data-page="assets"><i class="ico"></i><span>Assets</span></button>
    <button data-page="restore"><i class="ico"></i><span>Restore</span></button>
    <button data-page="duplicates"><i class="ico"></i><span>Duplicates</span></button>
  </nav>
  <div class="nav-label">Organize</div>
  <nav class="nav">
    <button data-page="albums"><i class="ico"></i><span>Albums</span></button>
    <button data-page="tags"><i class="ico"></i><span>Tags</span></button>
  </nav>
  <div class="grow"></div>
  <nav class="nav">
    <button data-page="settings"><i class="ico"></i><span>Settings</span></button>
    <button data-page="docs"><i class="ico"></i><span>API Docs</span></button>
  </nav>
  <div class="connection"><span class="dot"></span>V2 demo shell</div>
</aside>
<div class="shell">
  <header class="topbar"><div class="crumb">Immich Companion / V2 / <b id="crumb">Status</b></div><div class="top-actions"><input class="top-search" placeholder="Search current interface…" disabled><button disabled>Tasks</button><button disabled>⋯</button></div></header>
  <div id="pageHost" class="page-host"></div>
</div>
</div>
<script>
const assetTiles = Array.from({length:12},(_,i)=>`<div class="asset"><div>IMG_${String(i+1).padStart(4,'0')}.jpg<br><span class="muted small">Demo asset</span></div></div>`).join('');
const pages={
status:{title:'Status',desc:'Read-only health, dependency, capability and version overview for Companion and its Immich connection.',context:'<span class="zone">Context rail</span><div class="section" style="margin-top:14px"><div class="card stack"><div>Companion <span class="badge ok">Healthy</span></div><div>Immich API <span class="badge ok">Connected</span></div><div>Database <span class="badge ok">Ready</span></div></div></div>',content:'<div class="notice">V2 shell demo. Navigation is the only implemented behavior in this first slice.</div><div class="metric-grid"><div class="card metric"><b>Healthy</b><span>Companion backend</span></div><div class="card metric"><b>Connected</b><span>Immich dependency</span></div><div class="card metric"><b>8</b><span>Capabilities</span></div><div class="card metric"><b>v2.x</b><span>Immich version</span></div></div>',inspector:'<span class="zone">Inspector</span><div class="section" style="margin-top:14px"><div class="card small muted">Demo capability summary from the V2 mockup.</div></div>'},
assets:{title:'Assets',desc:'Search, browse, select, synchronize and perform guarded actions on assets.',context:'<span class="zone">Context rail</span><div class="section" style="margin-top:14px"><div class="card"><b>Search mode</b><p class="muted small">Simple / Expert demo controls will be wired later.</p></div></div>',content:`<div class="notice">Demo Assets page content only. Controls are intentionally not connected yet.</div><div class="grid-assets">${assetTiles}</div>`,inspector:'<span class="zone">Inspector</span><div class="section" style="margin-top:14px"><div class="card"><b>3 assets selected</b><p class="muted small">Demo selection summary.</p></div></div>'},
restore:{title:'Restore',desc:'Review current Immich trash and restore individual, selected, or all trashed assets.',context:'<span class="zone">Context rail</span><div class="section" style="margin-top:14px"><div class="card"><b>126 items</b><p class="muted small">Demo trash summary.</p></div></div>',content:`<div class="notice">Demo Restore page content only.</div><div class="grid-assets">${assetTiles.slice(0)}</div>`,inspector:'<span class="zone">Inspector</span><div class="section" style="margin-top:14px"><div class="card small muted">Restore actions will be connected in a later V2 slice.</div></div>'},
duplicates:{title:'Duplicates',desc:'Review exact and similarity duplicate groups, save member decisions, and process only actionable groups.',context:'<span class="zone">Context rail</span><div class="section" style="margin-top:14px"><div class="card"><b>Review filter</b><p class="muted small">All groups · demo state</p></div></div>',content:'<div class="notice">Demo duplicate groups. Comparison and decisions are not wired in this slice.</div>'+[1,2,3,4].map((g)=>`<div class="card"><div class="row"><b>Group ${g}</b><span class="badge">${g+1} images</span><span class="badge ${g%2?'ok':'warn'}">${g%2?'Actionable':'Needs review'}</span></div><p class="muted small">Static content from the V2 design direction.</p></div>`).join(''),inspector:'<span class="zone">Inspector</span><div class="section" style="margin-top:14px"><div class="card"><b>Batch readiness</b><p class="muted small">Demo summary.</p></div></div>'},
albums:{title:'Albums',desc:'Search, sort, create, edit, delete and use albums to filter the Assets workspace.',context:'<span class="zone">Context rail</span><div class="section" style="margin-top:14px"><div class="card small muted">Album search and sorting demo area.</div></div>',content:'<div class="notice">Demo Albums page content only.</div><div class="card"><table class="table"><tr><th>Name</th><th>Assets</th><th>Description</th></tr><tr><td>Family</td><td>822</td><td class="muted">Album description</td></tr><tr><td>Trips</td><td>416</td><td class="muted">Album description</td></tr><tr><td>Camera Imports</td><td>1204</td><td class="muted">Album description</td></tr></table></div>',inspector:'<span class="zone">Inspector</span><div class="section" style="margin-top:14px"><div class="card small muted">Album editor placeholder from the demo.</div></div>'},
tags:{title:'Tags',desc:'Manage searchable hierarchical tags, parent relationships, colors and asset filters.',context:'<span class="zone">Context rail</span><div class="section" style="margin-top:14px"><div class="card small muted">People<br>↳ Family<br>↳ Friends<br><br>Places<br>↳ Canada<br>↳ Europe</div></div>',content:'<div class="notice">Demo Tags page content only.</div><div class="card"><table class="table"><tr><th>Tag</th><th>Path</th><th>Assets</th></tr><tr><td>Family</td><td class="muted">People / Family</td><td>430</td></tr><tr><td>Vacation</td><td class="muted">Places / Vacation</td><td>221</td></tr><tr><td>Work</td><td class="muted">Projects / Work</td><td>89</td></tr></table></div>',inspector:'<span class="zone">Inspector</span><div class="section" style="margin-top:14px"><div class="card small muted">Tag editor placeholder from the demo.</div></div>'},
settings:{title:'Settings',desc:'Configure background load limits, duplicate defaults and incremental/global synchronization schedules.',context:'<span class="zone">Context rail</span><div class="section" style="margin-top:14px"><div class="card small muted">Background load<br>Duplicate handling<br>Sync schedules</div></div>',content:'<div class="notice">Demo Settings page content only.</div><div class="card"><h3>Background batch load</h3><p class="muted">Assets per batch · 100</p><p class="muted">Minimum delay · 1 second</p></div><div class="card"><h3>Incremental sync</h3><span class="badge ok">Enabled</span><p class="muted">*/15 * * * *</p></div>',inspector:'<span class="zone">Inspector</span><div class="section" style="margin-top:14px"><div class="card small muted">Validation summary placeholder.</div></div>'},
docs:{title:'API Docs',desc:'Developer-facing API documentation inside the V2 shell.',context:'<span class="zone">Context rail</span><div class="section" style="margin-top:14px"><div class="card small muted">Status<br>Assets<br>Relations<br>Duplicates<br>Settings<br>Tasks</div></div>',content:'<div class="notice">Demo API Docs page content only.</div><div class="card"><b>GET /status</b><p class="muted">Read current health and capabilities</p></div><div class="card"><b>POST /assets/search</b><p class="muted">Search assets</p></div><div class="card"><b>POST /duplicates/scan</b><p class="muted">Start duplicate similarity analysis</p></div>',inspector:'<span class="zone">Inspector</span><div class="section" style="margin-top:14px"><div class="card small muted">Selected endpoint placeholder.</div></div>'}
};
function renderPage(key){const p=pages[key]||pages.status;document.getElementById('crumb').textContent=p.title;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===key));document.getElementById('pageHost').innerHTML=`<section class="page-head"><div class="head-row"><div class="title"><span class="zone">Page identity</span><h1>${p.title}</h1><p>${p.desc}</p></div></div></section><section class="workspace"><aside class="context">${p.context}</aside><main class="content">${p.content}</main><aside class="inspector">${p.inspector}</aside></section>`;}
function go(key){history.replaceState(null,'','#'+key);renderPage(key)}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
window.addEventListener('hashchange',()=>renderPage((location.hash||'#status').slice(1)));
renderPage((location.hash||'#status').slice(1));
</script>
</body>
</html>
