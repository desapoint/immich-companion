name: Apply V2 duplicate review state v7

on:
  push:
    branches:
      - work/v2-duplicate-review-state
    paths:
      - .github/workflows/apply-v2-duplicate-review-state-v7.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/v2-duplicate-review-state

      - name: Apply corrected V2 review-state slice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path('.github/workflows/apply-v2-duplicate-review-state-v6.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          lines = text[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(script, '<v2-review-state-v6-patch>', 'exec'), {})

          repo = Path('backend/companion/composite_duplicate_repository.py')
          value = repo.read_text()
          block_start = value.index('\nasync def update_v2_policy_states(') + 1
          block_end = value.index('\n    async def replace_snapshot(', block_start)
          block = value[block_start:block_end]
          indented = '\n'.join(('    ' + line) if line else line for line in block.splitlines())
          repo.write_text(value[:block_start] + indented + value[block_end:])

          test = Path('backend/tests/test_composite_duplicate_sync.py')
          value = test.read_text()
          import_anchor = "    CompositeDuplicateSnapshotPage,\n    _group_projection_summary,\n)"
          import_replacement = "    CompositeDuplicateRepository,\n    CompositeDuplicateSnapshotPage,\n    _group_projection_summary,\n)"
          if import_anchor not in value:
              raise SystemExit('Missing composite repository test import anchor')
          value = value.replace(import_anchor, import_replacement, 1)
          test_anchor = "\ndef test_projection_summary_supports_database_sorts() -> None:\n"
          regression = "\ndef test_composite_repository_exposes_paged_state_methods() -> None:\n    assert callable(CompositeDuplicateRepository.page)\n    assert callable(CompositeDuplicateRepository.update_v2_policy_states)\n    assert callable(CompositeDuplicateRepository.replace_snapshot)\n\n"
          if test_anchor not in value:
              raise SystemExit('Missing composite repository test insertion anchor')
          test.write_text(value.replace(test_anchor, regression + test_anchor, 1))

          compile(repo.read_text(), str(repo), 'exec')
          PY

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Validate backend
        shell: bash
        run: |
          python -m pip install -e './backend[dev]'
          cd backend
          ruff format companion/composite_duplicate_repository.py companion/discovery/persisted_composite.py companion/duplicate_service.py companion/main.py companion/v2_duplicate_review_state.py companion/migrations/versions/20260914_0047_v2_duplicate_review_state.py tests/test_composite_duplicate_sync.py tests/test_v2_duplicate_review_state.py
          ruff check --fix companion/composite_duplicate_repository.py companion/discovery/persisted_composite.py companion/duplicate_service.py companion/main.py companion/v2_duplicate_review_state.py companion/migrations/versions/20260914_0047_v2_duplicate_review_state.py tests/test_composite_duplicate_sync.py tests/test_v2_duplicate_review_state.py
          pytest
          ruff check companion tests

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend
        shell: bash
        run: |
          cd frontend
          npm ci
          npm run check
          npm test

      - name: Commit validated implementation
        shell: bash
        run: |
          rm -f .github/workflows/apply-v2-duplicate-review-state.yml .github/workflows/apply-v2-duplicate-review-state-v3.yml .github/workflows/apply-v2-duplicate-review-state-v4.yml .github/workflows/apply-v2-duplicate-review-state-v5.yml .github/workflows/apply-v2-duplicate-review-state-v6.yml .github/workflows/apply-v2-duplicate-review-state-v7.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend frontend .github/workflows/apply-v2-duplicate-review-state.yml .github/workflows/apply-v2-duplicate-review-state-v3.yml .github/workflows/apply-v2-duplicate-review-state-v4.yml .github/workflows/apply-v2-duplicate-review-state-v5.yml .github/workflows/apply-v2-duplicate-review-state-v6.yml .github/workflows/apply-v2-duplicate-review-state-v7.yml
          git commit -m 'perf: make V2 duplicate review filters SQL-native'
          git push origin HEAD:work/v2-duplicate-review-state
