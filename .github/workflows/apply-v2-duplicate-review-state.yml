name: Apply V2 duplicate review state

on:
  push:
    branches:
      - work/v2-duplicate-review-state
    paths:
      - .github/workflows/apply-v2-duplicate-review-state.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/v2-duplicate-review-state

      - name: Apply V2 review-state slice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Missing patch anchor in {path}: {old[:160]!r}")
              file.write_text(text.replace(old, new, 1))

          def replace_between(path: str, start: str, end: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f"Missing start marker in {path}: {start!r}")
              b = text.find(end, a)
              if b < 0:
                  raise SystemExit(f"Missing end marker in {path}: {end!r}")
              file.write_text(text[:a] + new + text[b:])

          repo = "backend/companion/composite_duplicate_repository.py"
          replace_once(
              repo,
              "    Uuid,\n    delete,\n    exists,\n    func,\n    select,\n)",
              "    Uuid,\n    and_,\n    bindparam,\n    case,\n    delete,\n    exists,\n    func,\n    select,\n)",
          )
          replace_once(
              repo,
              "from companion.models import AssetRecord, Base",
              "from companion.models import AssetRecord, Base, DuplicateGroupReviewRecord",
          )
          replace_once(
              repo,
              "    first_discovered_at: Mapped[datetime] = mapped_column(\n        DateTime(timezone=True), nullable=False, index=True\n    )\n    provider_metadata:",
              "    first_discovered_at: Mapped[datetime] = mapped_column(\n        DateTime(timezone=True), nullable=False, index=True\n    )\n    v2_policy_state: Mapped[str] = mapped_column(\n        String(24), nullable=False, server_default=\"blocked\", index=True\n    )\n    v2_state_updated_at: Mapped[datetime | None] = mapped_column(\n        DateTime(timezone=True), nullable=True\n    )\n    provider_metadata:",
          )

          page_method = dedent('''
              async def update_v2_policy_states(
                  self,
                  states: list[tuple[str, str, str]],
              ) -> int:
                  """Publish bounded V2 policy summaries only for unchanged group memberships."""

                  if not states:
                      return 0
                  now = datetime.now(UTC)
                  table = CompositeDuplicateGroupRecord.__table__
                  statement = (
                      table.update()
                      .where(
                          table.c.group_id == bindparam("target_group_id"),
                          table.c.member_fingerprint == bindparam("target_member_fingerprint"),
                      )
                      .values(
                          v2_policy_state=bindparam("v2_policy_state_value"),
                          v2_state_updated_at=bindparam("v2_state_updated_at_value"),
                      )
                  )
                  values = [
                      {
                          "target_group_id": group_id,
                          "target_member_fingerprint": member_fingerprint,
                          "v2_policy_state_value": policy_state,
                          "v2_state_updated_at_value": now,
                      }
                      for group_id, member_fingerprint, policy_state in states
                  ]
                  async with self._database.sessions() as session, session.begin():
                      await session.execute(statement, values)
                  return len(values)

              async def page(
                  self,
                  *,
                  page: int,
                  page_size: int,
                  source: DiscoverySource | None = None,
                  sort: str = "reclaimable",
                  direction: str = "desc",
                  state: str = "all",
              ) -> CompositeDuplicateSnapshotPage:
                  """Read one ordered SQL-filtered page before hydrating its members."""

                  page = max(1, page)
                  page_size = max(1, min(page_size, 100))
                  offset = (page - 1) * page_size
                  source_filter = (
                      exists(
                          select(1).where(
                              CompositeDuplicateGroupEvidenceRecord.group_id
                              == CompositeDuplicateGroupRecord.group_id,
                              CompositeDuplicateGroupEvidenceRecord.discovery_source == source.value,
                          )
                      )
                      if source is not None
                      else None
                  )

                  async with self._database.sessions() as session:
                      sort_column = {
                          "reclaimable": CompositeDuplicateGroupRecord.reclaimable_bytes,
                          "members": CompositeDuplicateGroupRecord.member_count,
                          "similarity": CompositeDuplicateGroupRecord.similarity_score,
                          "newest": CompositeDuplicateGroupRecord.newest_taken_at,
                          "oldest": CompositeDuplicateGroupRecord.oldest_taken_at,
                          "discovered": CompositeDuplicateGroupRecord.first_discovered_at,
                      }.get(sort, CompositeDuplicateGroupRecord.reclaimable_bytes)
                      order = sort_column.desc() if direction == "desc" else sort_column.asc()
                      count_statement = select(func.count()).select_from(CompositeDuplicateGroupRecord)
                      group_statement = select(CompositeDuplicateGroupRecord)

                      if state != "all":
                          review_join = and_(
                              DuplicateGroupReviewRecord.stable_group_key
                              == CompositeDuplicateGroupRecord.stable_group_key,
                              DuplicateGroupReviewRecord.member_fingerprint
                              == CompositeDuplicateGroupRecord.member_fingerprint,
                          )
                          decision_count = func.coalesce(
                              func.json_array_length(DuplicateGroupReviewRecord.member_decisions), 0
                          )
                          resolved_state = case(
                              (
                                  CompositeDuplicateGroupRecord.v2_policy_state == "blocked",
                                  "Blocked",
                              ),
                              (
                                  (decision_count > 0)
                                  & (decision_count < CompositeDuplicateGroupRecord.member_count),
                                  "Needs decisions",
                              ),
                              (
                                  decision_count == CompositeDuplicateGroupRecord.member_count,
                                  "Actionable",
                              ),
                              (
                                  CompositeDuplicateGroupRecord.v2_policy_state == "auto_ready",
                                  "Actionable",
                              ),
                              else_="Needs review",
                          )
                          count_statement = count_statement.outerjoin(
                              DuplicateGroupReviewRecord, review_join
                          )
                          group_statement = group_statement.outerjoin(
                              DuplicateGroupReviewRecord, review_join
                          )
                          if state == "auto_ready":
                              state_filter = and_(
                                  CompositeDuplicateGroupRecord.v2_policy_state == "auto_ready",
                                  resolved_state == "Actionable",
                              )
                          else:
                              expected = {
                                  "needs_review": "Needs review",
                                  "blocked": "Blocked",
                                  "actionable": "Actionable",
                                  "needs_decisions": "Needs decisions",
                              }.get(state)
                              state_filter = resolved_state == expected if expected is not None else None
                          if state_filter is not None:
                              count_statement = count_statement.where(state_filter)
                              group_statement = group_statement.where(state_filter)

                      if source_filter is not None:
                          count_statement = count_statement.where(source_filter)
                          group_statement = group_statement.where(source_filter)

                      group_statement = (
                          group_statement.order_by(
                              order.nulls_last(),
                              CompositeDuplicateGroupRecord.group_id.asc(),
                          )
                          .offset(offset)
                          .limit(page_size)
                      )
                      total = int((await session.scalar(count_statement)) or 0)
                      group_rows = list((await session.execute(group_statement)).scalars())
                      group_ids = [row.group_id for row in group_rows]
                      if group_ids:
                          member_rows = list(
                              (
                                  await session.execute(
                                      select(
                                          CompositeDuplicateGroupMemberRecord.group_id,
                                          CompositeDuplicateGroupMemberRecord.asset_id,
                                      )
                                      .where(
                                          CompositeDuplicateGroupMemberRecord.group_id.in_(group_ids)
                                      )
                                      .order_by(
                                          CompositeDuplicateGroupMemberRecord.group_id,
                                          CompositeDuplicateGroupMemberRecord.position,
                                      )
                                  )
                              ).all()
                          )
                          evidence_rows = list(
                              (
                                  await session.execute(
                                      select(CompositeDuplicateGroupEvidenceRecord)
                                      .where(
                                          CompositeDuplicateGroupEvidenceRecord.group_id.in_(group_ids)
                                      )
                                      .order_by(
                                          CompositeDuplicateGroupEvidenceRecord.group_id,
                                          CompositeDuplicateGroupEvidenceRecord.discovery_source,
                                      )
                                  )
                              ).scalars()
                          )
                      else:
                          member_rows = []
                          evidence_rows = []

                  members: dict[str, list[UUID]] = {}
                  for group_id, asset_id in member_rows:
                      members.setdefault(group_id, []).append(asset_id)
                  evidence: dict[str, list[DiscoveryEvidence]] = {}
                  for row in evidence_rows:
                      evidence.setdefault(row.group_id, []).append(
                          DiscoveryEvidence(
                              discovery_source=DiscoverySource(row.discovery_source),
                              provider_group_id=row.provider_group_id,
                              metadata=dict(row.evidence_metadata or {}),
                          )
                      )
                  groups = [
                      CompositeDuplicateSnapshotGroup(
                          group_id=row.group_id,
                          discovery_source=DiscoverySource(row.discovery_source),
                          provider_group_id=row.provider_group_id,
                          asset_ids=tuple(members.get(row.group_id, [])),
                          provider_metadata=dict(row.provider_metadata or {}),
                          evidence=tuple(evidence.get(row.group_id, [])),
                          similarity_validation=_validation_from_payload(row.similarity_validation),
                      )
                      for row in group_rows
                      if len(members.get(row.group_id, [])) >= 2
                  ]
                  return CompositeDuplicateSnapshotPage(
                      groups=groups,
                      total=total,
                      page=page,
                      page_size=page_size,
                      pages=(total + page_size - 1) // page_size,
                  )

          ''')
          replace_between(repo, "    async def page(\n", "    async def replace_snapshot(\n", page_method)
          replace_once(
              repo,
              '                        "first_discovered_at": now,\n                        "provider_metadata":',
              '                        "first_discovered_at": now,\n                        "v2_policy_state": "blocked",\n                        "v2_state_updated_at": None,\n                        "provider_metadata":',
          )
          replace_once(
              repo,
              '                            "newest_taken_at": statement.excluded.newest_taken_at,\n                            "provider_metadata":',
              '                            "newest_taken_at": statement.excluded.newest_taken_at,\n                            "v2_policy_state": statement.excluded.v2_policy_state,\n                            "v2_state_updated_at": statement.excluded.v2_state_updated_at,\n                            "provider_metadata":',
          )

          provider = "backend/companion/discovery/persisted_composite.py"
          replace_once(
              provider,
              '        direction: str = "desc",\n    ) -> CompositeDuplicateSnapshotPage: ...',
              '        direction: str = "desc",\n        state: str = "all",\n    ) -> CompositeDuplicateSnapshotPage: ...',
          )
          provider_text = Path(provider).read_text()
          provider_start = provider_text.index("    async def discover_page(\n")
          provider_end = len(provider_text)
          provider_method = dedent('''
              async def discover_page(
                  self,
                  *,
                  page: int,
                  page_size: int,
                  source: str = "both",
                  sort: str = "reclaimable",
                  direction: str = "desc",
                  state: str = "all",
              ) -> DiscoveredGroupPage:
                  source_value = (
                      DiscoverySource.IMMICH_DUPLICATE
                      if source == "immich"
                      else DiscoverySource.COMPANION_SIMILARITY
                      if source == "similarity"
                      else None
                  )
                  snapshot = await self._snapshots.page(
                      page=page,
                      page_size=page_size,
                      source=source_value,
                      sort=sort,
                      direction=direction,
                      state=state,
                  )
                  return DiscoveredGroupPage(
                      groups=await self._hydrate(snapshot.groups),
                      total=snapshot.total,
                      page=snapshot.page,
                      page_size=snapshot.page_size,
                      pages=snapshot.pages,
                  )
          ''')
          Path(provider).write_text(provider_text[:provider_start] + provider_method)

          service = "backend/companion/duplicate_service.py"
          service_text = Path(service).read_text()
          a = service_text.index("    async def review_page(\n")
          b = service_text.index("    async def _snapshot(\n", a)
          segment = service_text[a:b]
          segment = segment.replace(
              '        direction: Literal["asc", "desc"] = "desc",\n    ) -> DuplicateSearchPage:',
              '        direction: Literal["asc", "desc"] = "desc",\n        state: Literal[\n            "all",\n            "needs_review",\n            "auto_ready",\n            "blocked",\n            "actionable",\n            "needs_decisions",\n        ] = "all",\n    ) -> DuplicateSearchPage:',
              1,
          )
          segment = segment.replace(
              "                sort=sort,\n                direction=direction,\n            )",
              "                sort=sort,\n                direction=direction,\n                state=state,\n            )",
              1,
          )
          Path(service).write_text(service_text[:a] + segment + service_text[b:])

          main = "backend/companion/main.py"
          replace_once(
              main,
              "from companion.duplicate_service import (\n    CrossSourceDuplicateService,\n    CrossSourceDuplicateTaskHandler,\n)\n",
              "from companion.duplicate_service import (\n    CrossSourceDuplicateService,\n    CrossSourceDuplicateTaskHandler,\n)\nfrom companion.v2_duplicate_review_state import V2DuplicateReviewStateService\n",
          )
          replace_once(
              main,
              "    composite_duplicate_repository = (\n        CompositeDuplicateRepository(database) if database is not None else None\n    )\n    source_duplicate_discovery = (",
              "    composite_duplicate_repository = (\n        CompositeDuplicateRepository(database) if database is not None else None\n    )\n    duplicate_discovery = (\n        PersistedCompositeDuplicateProvider(\n            composite_duplicate_repository,\n            asset_repository,\n        )\n        if composite_duplicate_repository is not None and asset_repository is not None\n        else None\n    )\n    v2_duplicate_review_state_service = (\n        V2DuplicateReviewStateService(\n            duplicate_discovery,\n            integrity_repository,\n            composite_duplicate_repository,\n        )\n        if duplicate_discovery is not None\n        and integrity_repository is not None\n        and composite_duplicate_repository is not None\n        else None\n    )\n    source_duplicate_discovery = (",
          )
          replace_once(
              main,
              "        task_coordinator.register_handler(\n            CompositeDuplicateRebuildTaskHandler(\n                source_duplicate_discovery,\n                composite_duplicate_repository,\n            )\n        )",
              "        composite_duplicate_handler = CompositeDuplicateRebuildTaskHandler(\n            source_duplicate_discovery,\n            composite_duplicate_repository,\n        )\n        task_coordinator.register_handler(\n            FollowUpTaskHandler(\n                composite_duplicate_handler,\n                v2_duplicate_review_state_service.refresh_after_change,\n            )\n            if v2_duplicate_review_state_service is not None\n            else composite_duplicate_handler\n        )",
          )
          later_discovery = dedent('''
              duplicate_discovery = (
                  PersistedCompositeDuplicateProvider(
                      composite_duplicate_repository,
                      asset_repository,
                  )
                  if composite_duplicate_repository is not None and asset_repository is not None
                  else None
              )
          ''')
          main_text = Path(main).read_text()
          first = main_text.find(later_discovery)
          second = main_text.find(later_discovery, first + 1) if first >= 0 else -1
          target = second if second >= 0 else first
          if target < 0:
              raise SystemExit("Missing duplicate_discovery block in main.py")
          Path(main).write_text(main_text[:target] + main_text[target + len(later_discovery):])
          replace_once(
              main,
              "        task_coordinator.register_handler(\n            CrossSourceDuplicateTaskHandler(\n                immich,\n                asset_repository,\n                integrity_repository,\n                integrity_handler,\n                include_similarity=True,\n                discovery=duplicate_discovery,\n            )\n        )",
              "        duplicate_analysis_handler = CrossSourceDuplicateTaskHandler(\n            immich,\n            asset_repository,\n            integrity_repository,\n            integrity_handler,\n            include_similarity=True,\n            discovery=duplicate_discovery,\n        )\n        task_coordinator.register_handler(\n            FollowUpTaskHandler(\n                duplicate_analysis_handler,\n                v2_duplicate_review_state_service.refresh_after_change,\n            )\n            if v2_duplicate_review_state_service is not None\n            else duplicate_analysis_handler\n        )",
          )
          main_text = Path(main).read_text()
          a = main_text.index("    @app.post(\n        \"/api/assets/duplicates/cross-source/page\"")
          b = main_text.index("    @app.post(\n        \"/api/assets/duplicates/cross-source/analyze\"", a)
          segment = main_text[a:b]
          segment = segment.replace(
              '        direction: Literal["asc", "desc"] = Query(default="desc"),\n    ) -> DuplicateSearchPage:',
              '        direction: Literal["asc", "desc"] = Query(default="desc"),\n        state: Literal[\n            "all",\n            "needs_review",\n            "auto_ready",\n            "blocked",\n            "actionable",\n            "needs_decisions",\n        ] = Query(default="all"),\n    ) -> DuplicateSearchPage:',
              1,
          )
          segment = segment.replace(
              "                sort=sort,\n                direction=direction,\n            )",
              "                sort=sort,\n                direction=direction,\n                state=state,\n            )",
              1,
          )
          Path(main).write_text(main_text[:a] + segment + main_text[b:])

          Path("backend/companion/v2_duplicate_review_state.py").write_text(dedent('''
          """Bounded V2 duplicate policy-state projection for SQL-native list filters."""

          from __future__ import annotations

          import logging

          from companion.composite_duplicate_repository import CompositeDuplicateRepository
          from companion.discovery.persisted_composite import PersistedCompositeDuplicateProvider
          from companion.duplicate_schema import DuplicateAnalysisOptions, ExactDuplicateGroup
          from companion.duplicate_service import CrossSourceDuplicateService
          from companion.integrity_repository import IntegrityRepository

          V2_DUPLICATE_REVIEW_STATE_BATCH_SIZE = 250
          V2_DUPLICATE_ANALYSIS_OPTIONS = DuplicateAnalysisOptions(
              keeper_policy="prefer_upload",
              external_library_ids=[],
              verify_upload_streams=False,
              automatic_handling_enabled=True,
              preselect_safe_groups=True,
              exact_file_action="resolve",
              analyze_automatically=False,
          )

          logger = logging.getLogger("uvicorn.error")


          def v2_policy_state(group: ExactDuplicateGroup) -> str:
              """Return policy state independent of manual draft progress."""

              if (
                  not group.eligible
                  or group.status == "ineligible"
                  or any(member.is_offline for member in group.members)
              ):
                  return "blocked"
              if group.auto_selected:
                  return "auto_ready"
              return "needs_review"


          class V2DuplicateReviewStateService:
              """Refresh policy summaries in bounded pages outside duplicate list requests."""

              def __init__(
                  self,
                  discovery: PersistedCompositeDuplicateProvider,
                  reports: IntegrityRepository,
                  snapshots: CompositeDuplicateRepository,
              ) -> None:
                  self._discovery = discovery
                  self._reports = reports
                  self._snapshots = snapshots

              async def refresh_after_change(self) -> object | None:
                  try:
                      return await self.refresh()
                  except Exception:
                      logger.exception("Could not refresh V2 duplicate policy-state projection")
                      return None

              async def refresh(self) -> dict[str, int]:
                  page = 1
                  updated = 0
                  while True:
                      discovered = await self._discovery.discover_page(
                          page=page,
                          page_size=V2_DUPLICATE_REVIEW_STATE_BATCH_SIZE,
                          source="both",
                          sort="discovered",
                          direction="asc",
                          state="all",
                      )
                      if not discovered.groups:
                          break
                      report_ids = list(
                          dict.fromkeys(
                              asset.id
                              for group in discovered.groups
                              for asset in group.assets
                              if asset.library_id is not None
                          )
                      )
                      reports = await self._reports.get_many(report_ids)
                      result = CrossSourceDuplicateService.assemble(
                          discovered.groups,
                          reports,
                          V2_DUPLICATE_ANALYSIS_OPTIONS,
                      )
                      states = [
                          (
                              group.group_id,
                              group.member_fingerprint,
                              v2_policy_state(group),
                          )
                          for group in result.groups
                      ]
                      updated += await self._snapshots.update_v2_policy_states(states)
                      if page >= discovered.pages:
                          break
                      page += 1
                  logger.info("Refreshed V2 duplicate policy states: groups=%s", updated)
                  return {"groups": updated}
          ''').lstrip())

          Path("backend/companion/migrations/versions/20260914_0047_v2_duplicate_review_state.py").write_text(dedent('''
          """Persist V2 duplicate policy state for SQL-native review filters.

          Revision ID: 20260914_0047
          Revises: 20260914_0046
          """

          from __future__ import annotations

          import sqlalchemy as sa
          from alembic import op

          revision = "20260914_0047"
          down_revision = "20260914_0046"
          branch_labels = None
          depends_on = None


          def upgrade() -> None:
              op.add_column(
