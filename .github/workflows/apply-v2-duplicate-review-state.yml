              op.drop_column("composite_duplicate_groups", "v2_policy_state")
          ''').lstrip())

          Path("backend/tests/test_v2_duplicate_review_state.py").write_text(dedent('''
          """Tests for V2 duplicate policy state."""

          from types import SimpleNamespace

          from companion.v2_duplicate_review_state import v2_policy_state


          def group(*, eligible=True, status="exact", offline=False, auto_selected=False):
              return SimpleNamespace(
                  eligible=eligible,
                  status=status,
                  members=[SimpleNamespace(is_offline=offline)],
                  auto_selected=auto_selected,
              )


          def test_policy_state_keeps_auto_ready_distinct_from_actionable() -> None:
              assert v2_policy_state(group(eligible=False, auto_selected=True)) == "blocked"
              assert v2_policy_state(group(status="ineligible")) == "blocked"
              assert v2_policy_state(group(offline=True)) == "blocked"
              assert v2_policy_state(group(auto_selected=True)) == "auto_ready"
              assert v2_policy_state(group()) == "needs_review"
          ''').lstrip())

          composite_test = "backend/tests/test_composite_duplicate_sync.py"
          replace_once(
              composite_test,
              '        direction="asc",\n    )',
              '        direction="asc",\n        state="needs_review",\n    )',
          )
          replace_once(
              composite_test,
              '        "direction": "asc",\n    }',
              '        "direction": "asc",\n        "state": "needs_review",\n    }',
          )

          contracts = "frontend/src/v2/data/contracts.ts"
          replace_once(
              contracts,
              "export type DuplicateGroupRecord = { id: string; discoverySources: DuplicateSource[]; state: DuplicateState; kind: string;",
              "export type DuplicateGroupRecord = { id: string; discoverySources: DuplicateSource[]; state: DuplicateState; autoReady: boolean; kind: string;",
          )

          frontend_repo = "frontend/src/v2/data/api/duplicateRepository.ts"
          replace_once(
              frontend_repo,
              "  let rawGroups = new Map<string, ApiDuplicateGroup>();\n  let hasSearchSnapshot = false;\n  let hasWorkspaceSnapshot = false;",
              "  let rawGroups = new Map<string, ApiDuplicateGroup>();\n  let hasWorkspaceSnapshot = false;",
          )
          replace_once(
              frontend_repo,
              "      state: groupState(group, draft),\n      kind:",
              "      state: groupState(group, draft),\n      autoReady: group.auto_selected,\n      kind:",
          )
          replace_once(
              frontend_repo,
              "function similarity(member: ApiDuplicateMember): number | null {",
              dedent('''
              function reviewStateParam(state: DuplicateSearchQuery['state']): string {
                if (!state || state === 'All groups') return 'all';
                if (state === 'Needs review') return 'needs_review';
                if (state === 'Auto-ready') return 'auto_ready';
                if (state === 'Blocked') return 'blocked';
                if (state === 'Actionable') return 'actionable';
                return 'needs_decisions';
              }

              function similarity(member: ApiDuplicateMember): number | null {
              '''),
          )
          frontend_text = Path(frontend_repo).read_text()
          a = frontend_text.index("    async search(query): Promise<PageResult<DuplicateGroupRecord>> {")
          b = frontend_text.index("    saveDraft,", a)
          search_method = dedent('''
              async search(query): Promise<PageResult<DuplicateGroupRecord>> {
                const page = pageNumber(query);
                const params = new URLSearchParams({
                  page: String(page),
                  page_size: String(query.pageSize),
                  source: query.source ?? 'both',
                  sort: query.sort?.field ?? 'reclaimable',
                  direction: query.sort?.direction ?? 'desc',
                  state: reviewStateParam(query.state),
                });
                const restoreWorkspace = !hasWorkspaceSnapshot || !query.reuseCachedGroups;
                const [rawPage, restored] = await Promise.all([
                  requestJson<ApiDuplicatePage | ApiDuplicateResult>(`/api/assets/duplicates/cross-source/page?${params.toString()}`, { ...jsonRequest('POST', ANALYSIS_OPTIONS), signal: query.signal }),
                  restoreWorkspace
                    ? requestJson<ApiDuplicateWorkspace>('/api/assets/duplicates/workspace', { signal: query.signal })
                    : Promise.resolve(null),
                ]);
                if (restored) {
                  workspace = restored;
                  hasWorkspaceSnapshot = true;
                }
                if (!query.reuseCachedGroups) rawGroups.clear();
                const result = normalizeDuplicatePage(rawPage, query, page);
                for (const group of result.items) rawGroups.set(group.group_id, group);
                const items = result.items.map(materialize);
                visibleGroupIds = new Set(items.map((group) => group.id));
                return {
                  items,
                  total: result.total,
                  pageSize: result.page_size,
                  page: result.page,
                  nextCursor: result.page < result.pages ? String(result.page + 1) : null,
                };
              },
          ''')
          Path(frontend_repo).write_text(frontend_text[:a] + search_method + frontend_text[b:])

          frontend_test = "frontend/src/v2/data/api/duplicateRepository.test.ts"
          replace_once(
              frontend_test,
              "    expect(pageRequests[0]?.searchParams.get('direction')).toBe('desc');\n    currentGroups = [group];",
              "    expect(pageRequests[0]?.searchParams.get('direction')).toBe('desc');\n    expect(pageRequests[0]?.searchParams.get('state')).toBe('all');\n    currentGroups = [group];",
          )
          replace_once(
              frontend_test,
              "    expect(pageRequests.at(-1)?.searchParams.get('direction')).toBe('asc');\n  });",
              "    expect(pageRequests.at(-1)?.searchParams.get('direction')).toBe('asc');\n\n    await repository.search({ page: 1, pageSize: 1, reuseCachedGroups: true, state: 'Needs decisions' });\n    expect(pageRequests.at(-1)?.searchParams.get('state')).toBe('needs_decisions');\n    await repository.search({ page: 1, pageSize: 1, reuseCachedGroups: true, state: 'Auto-ready' });\n    expect(pageRequests.at(-1)?.searchParams.get('state')).toBe('auto_ready');\n    expect(fetcher.mock.calls.some(([input]) => String(input).endsWith('/cross-source/search'))).toBe(false);\n  });",
          )
          replace_once(
              frontend_test,
              "      state: 'Needs decisions',\n      selected: true,",
              "      state: 'Needs decisions',\n      autoReady: true,\n      selected: true,",
          )

          page_file = "frontend/src/v2/pages/V2DuplicatesPage.svelte"
          replace_once(
              page_file,
              "<V2Button disabled={mutating||!groups.some((item)=>item.state==='Actionable')} onclick={()=>{selectedGroups=groups.filter((item)=>item.state==='Actionable').map((item)=>item.id);persistSelection()}}>Select auto-ready</V2Button>",
              "<V2Button disabled={mutating||!groups.some((item)=>item.autoReady&&item.state==='Actionable')} onclick={()=>{selectedGroups=groups.filter((item)=>item.autoReady&&item.state==='Actionable').map((item)=>item.id);persistSelection()}}>Select auto-ready</V2Button>",
          )
          replace_once(
              page_file,
              "sortFields={reviewFilter==='All groups'?[{value:'reclaimable',label:'Reclaimable space'},{value:'members',label:'Group size'},{value:'similarity',label:'Similarity'},{value:'newest',label:'Newest'},{value:'oldest',label:'Oldest'},{value:'discovered',label:'Recently discovered'}]:[]}",
              "sortFields={[{value:'reclaimable',label:'Reclaimable space'},{value:'members',label:'Group size'},{value:'similarity',label:'Similarity'},{value:'newest',label:'Newest'},{value:'oldest',label:'Oldest'},{value:'discovered',label:'Recently discovered'}]}",
          )

          for path in (
              repo,
              provider,
              service,
              main,
              "backend/companion/v2_duplicate_review_state.py",
              "backend/companion/migrations/versions/20260914_0047_v2_duplicate_review_state.py",
              composite_test,
              "backend/tests/test_v2_duplicate_review_state.py",
          ):
              compile(Path(path).read_text(), path, "exec")
          PY

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Validate backend
        shell: bash
        run: |
          python -m pip install -e './backend[dev]'
          cd backend
          ruff format companion/composite_duplicate_repository.py companion/discovery/persisted_composite.py companion/duplicate_service.py companion/main.py companion/v2_duplicate_review_state.py companion/migrations/versions/20260914_0047_v2_duplicate_review_state.py tests/test_composite_duplicate_sync.py tests/test_v2_duplicate_review_state.py
          ruff check --fix companion/composite_duplicate_repository.py companion/discovery/persisted_composite.py companion/duplicate_service.py companion/main.py companion/v2_duplicate_review_state.py companion/migrations/versions/20260914_0047_v2_duplicate_review_state.py tests/test_composite_duplicate_sync.py tests/test_v2_duplicate_review_state.py
          pytest
          ruff check companion tests

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend
        shell: bash
        run: |
          cd frontend
          npm ci
          npm run check
          npm test

      - name: Commit validated implementation
        shell: bash
        run: |
          rm -f .github/workflows/apply-v2-duplicate-review-state.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend frontend .github/workflows/apply-v2-duplicate-review-state.yml
          git commit -m 'perf: make V2 duplicate review filters SQL-native'
          git push origin HEAD:work/v2-duplicate-review-state
