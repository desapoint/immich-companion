name: Apply composite maintenance hook

on:
  push:
    branches:
      - feat/v2-shell
    paths:
      - tools/apply_composite_maintenance_patch.py
      - .github/workflows/apply-composite-maintenance-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-shell
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply maintenance hook
        run: python tools/apply_composite_maintenance_patch.py
      - name: Format main
        run: |
          python -m pip install 'ruff<1,>=0.8'
          ruff check --fix backend/companion/main.py
      - name: Remove one-shot patch machinery
        run: git rm tools/apply_composite_maintenance_patch.py .github/workflows/apply-composite-maintenance-patch.yml
      - name: Commit wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/companion/main.py
          git commit -m 'fix: rebuild composite duplicates after similarity maintenance'
          git push origin HEAD:feat/v2-shell
