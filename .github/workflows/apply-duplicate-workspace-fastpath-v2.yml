name: Apply duplicate workspace fast path v2

on:
  push:
    branches:
      - feat/v2-shell
    paths:
      - .github/workflows/apply-duplicate-workspace-fastpath-v2.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-shell

      - name: Apply bounded workspace patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/apply_duplicate_workspace_fastpath.py
          python -m py_compile /tmp/apply_duplicate_workspace_fastpath.py
          python /tmp/apply_duplicate_workspace_fastpath.py
          rm -f \
            .github/workflows/apply-duplicate-workspace-fastpath.yml \
            .github/workflows/retry-duplicate-workspace-fastpath.yml \
            .github/workflows/apply-duplicate-workspace-fastpath-v2.yml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e './backend[dev]'

      - name: Validate backend
        working-directory: backend
        run: |
          pytest
          ruff check companion tests

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm test

      - name: Commit validated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'perf: bound duplicate workspace restoration'
          git push origin HEAD:feat/v2-shell
