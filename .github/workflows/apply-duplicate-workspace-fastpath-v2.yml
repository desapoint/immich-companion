name: Apply duplicate workspace fast path v2

on:
  push:
    branches:
      - feat/v2-shell
    paths:
      - .github/workflows/apply-duplicate-workspace-fastpath-v2.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-shell
          fetch-depth: 1

      - name: Apply bounded workspace patch
        shell: bash
        run: |
          git fetch origin 76b861e3b337247650251846f3872944c051a8c5 --depth=1
          git show 76b861e3b337247650251846f3872944c051a8c5:.github/workflows/apply-duplicate-workspace-fastpath-v2.yml > /tmp/original-fastpath.yml
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import re

          workflow = Path('/tmp/original-fastpath.yml').read_text()
          match = re.search(r"echo '([^']+)' \| base64 -d \| gzip -d", workflow)
          if match is None:
              raise SystemExit('Could not recover validated patch payload')
          payload = gzip.decompress(base64.b64decode(match.group(1))).decode()
          compile(payload, '<duplicate-workspace-fastpath>', 'exec')
          exec(compile(payload, '<duplicate-workspace-fastpath>', 'exec'))

          service_path = Path('backend/companion/duplicate_service.py')
          service = service_path.read_text()
          old = '            if current is None or source_value(current) != record.discovery_source:\n                continue\n'
          new = (
              '            if current is None:\n'
              '                continue\n'
              '            record_source = getattr(record, "discovery_source", None)\n'
              '            if record_source is not None and source_value(current) != record_source:\n'
              '                continue\n'
          )
          if old not in service:
              raise SystemExit('Missing workspace draft compatibility anchor')
          service_path.write_text(service.replace(old, new, 1))

          repository_path = Path('backend/companion/composite_duplicate_repository.py')
          repository = repository_path.read_text()
          old_imports = (
              'from companion.database import DatabaseManager\n'
              'from companion.duplicate_identity import member_set_key, stable_group_key\n'
              'from companion.discovery.base import DiscoveredGroup, DiscoveryEvidence\n'
          )
          new_imports = (
              'from companion.database import DatabaseManager\n'
              'from companion.discovery.base import DiscoveredGroup, DiscoveryEvidence\n'
              'from companion.duplicate_identity import member_set_key, stable_group_key\n'
          )
          if old_imports not in repository:
              raise SystemExit('Missing composite repository import-order anchor')
          repository_path.write_text(repository.replace(old_imports, new_imports, 1))

          test_path = Path('backend/tests/test_duplicate_service.py')
          test = test_path.read_text()
          anchor = '        draft_status="pending",\n    )\n    service = CrossSourceDuplicateService(\n'
          replacement = (
              '        draft_status="pending",\n'
              '        manual_action=None,\n'
              '        manual_primary_asset_id=None,\n'
              '        review_status="pending",\n'
              '    )\n'
              '    service = CrossSourceDuplicateService(\n'
          )
          position = test.rfind(anchor)
          if position < 0:
              raise SystemExit('Missing fast-path regression test compatibility anchor')
          test = test[:position] + replacement + test[position + len(anchor):]
          test_path.write_text(test)
          PY
          rm -f \
            .github/workflows/apply-duplicate-workspace-fastpath.yml \
            .github/workflows/retry-duplicate-workspace-fastpath.yml \
            .github/workflows/apply-duplicate-workspace-fastpath-v2.yml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e './backend[dev]'

      - name: Validate backend
        working-directory: backend
        run: |
          pytest
          ruff check companion tests

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm test

      - name: Commit validated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'perf: bound duplicate workspace restoration'
          git push origin HEAD:feat/v2-shell
