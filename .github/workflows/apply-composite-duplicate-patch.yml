name: Apply composite duplicate wiring

on:
  push:
    branches:
      - feat/v2-shell
    paths:
      - tools/apply_composite_duplicate_patch.py
      - .github/workflows/apply-composite-duplicate-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-shell
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply wiring patch
        run: python tools/apply_composite_duplicate_patch.py
      - name: Format imports
        run: |
          python -m pip install 'ruff<1,>=0.8'
          ruff check --fix backend/companion/main.py backend/companion/composite_duplicate_repository.py backend/companion/composite_duplicate_sync.py backend/companion/discovery/persisted_composite.py
      - name: Remove one-shot patch machinery
        run: git rm tools/apply_composite_duplicate_patch.py .github/workflows/apply-composite-duplicate-patch.yml
      - name: Commit wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/companion/main.py backend/companion/composite_duplicate_repository.py backend/companion/composite_duplicate_sync.py backend/companion/discovery/persisted_composite.py
          git commit -m 'feat: wire persisted composite duplicate projection'
          git push origin HEAD:feat/v2-shell
