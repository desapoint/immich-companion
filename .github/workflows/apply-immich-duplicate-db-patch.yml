name: Apply Immich duplicate DB wiring

on:
  push:
    branches:
      - feat/v2-shell
    paths:
      - tools/apply_immich_duplicate_db_patch.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-shell
          fetch-depth: 0
      - name: Apply source wiring
        run: python tools/apply_immich_duplicate_db_patch.py
      - name: Commit source wiring
        run: |
          if git diff --quiet; then
            echo "No patch changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/companion/main.py frontend/src/v2/pages/V2SettingsPage.svelte
          git commit -m "feat: wire database-backed Immich duplicate sync"
          git push origin HEAD:feat/v2-shell
