name: Validate Immich duplicate DB work

# Rerun 3: validate persisted composite duplicate projection.
on:
  push:
    branches:
      - feat/v2-shell
    paths:
      - .github/workflows/validate-immich-duplicate-db.yml

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e './backend[dev]'
      - name: Run backend tests
        working-directory: backend
        run: pytest
      - name: Run Ruff
        working-directory: backend
        run: ruff check companion tests
