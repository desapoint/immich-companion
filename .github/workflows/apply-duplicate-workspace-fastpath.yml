name: Apply duplicate workspace fast path

on:
  push:
    branches: [feat/v2-shell]
    paths: [.github/workflows/apply-duplicate-workspace-fastpath.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-shell
      - name: Apply workspace fast path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing patch anchor: {label}")
              return text.replace(old, new, 1)

          # Composite projection: persist/query stable identity and hydrate selected groups only.
          path = Path('backend/companion/composite_duplicate_repository.py')
          text = path.read_text()
          text = replace_once(
              text,
              'from companion.database import DatabaseManager\n',
              'from companion.database import DatabaseManager\nfrom companion.duplicate_identity import member_set_key, stable_group_key\n',
              'composite identity import',
          )
          text = replace_once(
              text,
              '    provider_group_id: Mapped[str | None] = mapped_column(Text, nullable=True)\n    provider_metadata:',
              '    provider_group_id: Mapped[str | None] = mapped_column(Text, nullable=True)\n    stable_group_key: Mapped[str] = mapped_column(Text, nullable=False, index=True)\n    member_fingerprint: Mapped[str] = mapped_column(Text, nullable=False)\n    provider_metadata:',
              'composite identity columns',
          )
          text = replace_once(
              text,
              '@dataclass(frozen=True, slots=True)\nclass CompositeDuplicateSnapshotGroup:',
              '@dataclass(frozen=True, slots=True)\nclass CompositeDuplicateGroupIdentity:\n    group_id: str\n    discovery_source: DiscoverySource\n    provider_group_id: str | None\n    stable_group_key: str\n    member_set_key: str\n    member_fingerprint: str\n\n\n@dataclass(frozen=True, slots=True)\nclass CompositeDuplicateSnapshotGroup:',
              'identity dataclass',
          )
          methods = '''    async def identities(\n        self,\n        *,\n        group_ids: list[str] | None = None,\n        stable_group_keys: list[str] | None = None,\n    ) -> list[CompositeDuplicateGroupIdentity]:\n        \"\"\"Resolve only persisted group identity; never hydrate members or evidence.\"\"\"\n\n        resolved: dict[str, CompositeDuplicateGroupRecord] = {}\n        ids = list(dict.fromkeys(group_ids or []))\n        keys = list(dict.fromkeys(stable_group_keys or []))\n        if not ids and not keys:\n            return []\n        async with self._database.sessions() as session:\n            for values, column in (\n                (ids, CompositeDuplicateGroupRecord.group_id),\n                (keys, CompositeDuplicateGroupRecord.stable_group_key),\n            ):\n                for offset in range(0, len(values), WRITE_BATCH_SIZE):\n                    batch = values[offset : offset + WRITE_BATCH_SIZE]\n                    rows = list(\n                        (\n                            await session.execute(\n                                select(CompositeDuplicateGroupRecord).where(column.in_(batch))\n                            )\n                        ).scalars()\n                    )\n                    resolved.update((row.group_id, row) for row in rows)\n        return [\n            CompositeDuplicateGroupIdentity(\n                group_id=row.group_id,\n                discovery_source=DiscoverySource(row.discovery_source),\n                provider_group_id=row.provider_group_id,\n                stable_group_key=row.stable_group_key,\n                member_set_key=row.member_fingerprint,\n                member_fingerprint=row.member_fingerprint,\n            )\n            for row in resolved.values()\n        ]\n\n    async def groups_by_ids(\n        self, group_ids: list[str]\n    ) -> list[CompositeDuplicateSnapshotGroup]:\n        \"\"\"Load complete persisted snapshots for only explicitly requested groups.\"\"\"\n\n        unique_ids = list(dict.fromkeys(group_ids))\n        if not unique_ids:\n            return []\n        async with self._database.sessions() as session:\n            group_rows = list(\n                (\n                    await session.execute(\n                        select(CompositeDuplicateGroupRecord)\n                        .where(CompositeDuplicateGroupRecord.group_id.in_(unique_ids))\n                        .order_by(CompositeDuplicateGroupRecord.position)\n                    )\n                ).scalars()\n            )\n            found_ids = [row.group_id for row in group_rows]\n            member_rows = list(\n                (\n                    await session.execute(\n                        select(\n                            CompositeDuplicateGroupMemberRecord.group_id,\n                            CompositeDuplicateGroupMemberRecord.asset_id,\n                        )\n                        .where(CompositeDuplicateGroupMemberRecord.group_id.in_(found_ids))\n                        .order_by(\n                            CompositeDuplicateGroupMemberRecord.group_id,\n                            CompositeDuplicateGroupMemberRecord.position,\n                        )\n                    )\n                ).all()\n            ) if found_ids else []\n            evidence_rows = list(\n                (\n                    await session.execute(\n                        select(CompositeDuplicateGroupEvidenceRecord)\n                        .where(CompositeDuplicateGroupEvidenceRecord.group_id.in_(found_ids))\n                        .order_by(\n                            CompositeDuplicateGroupEvidenceRecord.group_id,\n                            CompositeDuplicateGroupEvidenceRecord.discovery_source,\n                        )\n                    )\n                ).scalars()\n            ) if found_ids else []\n\n        members: dict[str, list[UUID]] = {}\n        for group_id, asset_id in member_rows:\n            members.setdefault(group_id, []).append(asset_id)\n        evidence: dict[str, list[DiscoveryEvidence]] = {}\n        for row in evidence_rows:\n            evidence.setdefault(row.group_id, []).append(\n                DiscoveryEvidence(\n                    discovery_source=DiscoverySource(row.discovery_source),\n                    provider_group_id=row.provider_group_id,\n                    metadata=dict(row.evidence_metadata or {}),\n                )\n            )\n        return [\n            CompositeDuplicateSnapshotGroup(\n                group_id=row.group_id,\n                discovery_source=DiscoverySource(row.discovery_source),\n                provider_group_id=row.provider_group_id,\n                asset_ids=tuple(members.get(row.group_id, [])),\n                provider_metadata=dict(row.provider_metadata or {}),\n                evidence=tuple(evidence.get(row.group_id, [])),\n                similarity_validation=_validation_from_payload(row.similarity_validation),\n            )\n            for row in group_rows\n            if len(members.get(row.group_id, [])) >= 2\n        ]\n\n'''
          text = replace_once(text, '    async def groups(self) -> list[CompositeDuplicateSnapshotGroup]:\n', methods + '    async def groups(self) -> list[CompositeDuplicateSnapshotGroup]:\n', 'identity/group lookup methods')
          old_rows = '''            group_rows = [\n                {\n                    "group_id": group.group_id,\n                    "position": position,\n                    "discovery_source": group.discovery_source.value,\n                    "provider_group_id": group.provider_group_id,\n                    "provider_metadata": dict(group.provider_metadata),\n                    "similarity_validation": _validation_payload(group.similarity_validation),\n                    "sync_generation": generation,\n                    "synced_at": now,\n                }\n                for position, group in enumerate(groups)\n            ]\n'''
          new_rows = '''            group_rows = []\n            for position, group in enumerate(groups):\n                fingerprint = member_set_key(asset.id for asset in group.assets)\n                group_rows.append(\n                    {\n                        "group_id": group.group_id,\n                        "position": position,\n                        "discovery_source": group.discovery_source.value,\n                        "provider_group_id": group.provider_group_id,\n                        "stable_group_key": stable_group_key(\n                            group.discovery_source, fingerprint\n                        ),\n                        "member_fingerprint": fingerprint,\n                        "provider_metadata": dict(group.provider_metadata),\n                        "similarity_validation": _validation_payload(\n                            group.similarity_validation\n                        ),\n                        "sync_generation": generation,\n                        "synced_at": now,\n                    }\n                )\n'''
          text = replace_once(text, old_rows, new_rows, 'snapshot identity write')
          text = replace_once(
              text,
              '                            "provider_group_id": statement.excluded.provider_group_id,\n                            "provider_metadata": statement.excluded.provider_metadata,',
              '                            "provider_group_id": statement.excluded.provider_group_id,\n                            "stable_group_key": statement.excluded.stable_group_key,\n                            "member_fingerprint": statement.excluded.member_fingerprint,\n                            "provider_metadata": statement.excluded.provider_metadata,',
              'snapshot identity upsert',
          )
          path.write_text(text)

          # Persisted provider: expose identity-only and explicit-group paths without asset-universe hydration.
          path = Path('backend/companion/discovery/persisted_composite.py')
          text = path.read_text()
          text = replace_once(
              text,
              'from companion.composite_duplicate_repository import CompositeDuplicateSnapshotGroup\n',
              'from companion.composite_duplicate_repository import (\n    CompositeDuplicateGroupIdentity,\n    CompositeDuplicateSnapshotGroup,\n)\n',
              'provider identity import',
          )
          text = replace_once(
              text,
              'class _CompositeSnapshotReader(Protocol):\n    async def groups(self) -> list[CompositeDuplicateSnapshotGroup]: ...\n',
              'class _CompositeSnapshotReader(Protocol):\n    async def groups(self) -> list[CompositeDuplicateSnapshotGroup]: ...\n    async def groups_by_ids(\n        self, group_ids: list[str]\n    ) -> list[CompositeDuplicateSnapshotGroup]: ...\n    async def identities(\n        self,\n        *,\n        group_ids: list[str] | None = None,\n        stable_group_keys: list[str] | None = None,\n    ) -> list[CompositeDuplicateGroupIdentity]: ...\n',
              'provider protocol',
          )
          insertion = '''    async def resolve_identities(\n        self,\n        *,\n        group_ids: list[str] | None = None,\n        stable_group_keys: list[str] | None = None,\n    ) -> list[CompositeDuplicateGroupIdentity]:\n        return await self._snapshots.identities(\n            group_ids=group_ids, stable_group_keys=stable_group_keys\n        )\n\n    async def discover_groups(self, group_ids: list[str]) -> list[DiscoveredGroup]:\n        snapshot = await self._snapshots.groups_by_ids(group_ids)\n        return await self._hydrate(snapshot)\n\n    async def _hydrate(\n        self, snapshot: list[CompositeDuplicateSnapshotGroup]\n    ) -> list[DiscoveredGroup]:\n        asset_ids = list(\n            dict.fromkeys(asset_id for group in snapshot for asset_id in group.asset_ids)\n        )\n        assets = await self._assets.get_immich_assets(asset_ids)\n        discovered: list[DiscoveredGroup] = []\n        for group in snapshot:\n            group_assets = tuple(\n                assets[asset_id] for asset_id in group.asset_ids if asset_id in assets\n            )\n            if len(group_assets) != len(group.asset_ids):\n                logger.warning(\n                    "Skipping persisted composite duplicate group %s because %s/%s local "\n                    "members are available",\n                    group.group_id,\n                    len(group_assets),\n                    len(group.asset_ids),\n                )\n                continue\n            discovered.append(\n                DiscoveredGroup(\n                    group_id=group.group_id,\n                    discovery_source=group.discovery_source,\n                    provider_group_id=group.provider_group_id,\n                    assets=group_assets,\n                    provider_metadata=group.provider_metadata,\n                    discovery_evidence=group.evidence,\n                    similarity_validation=group.similarity_validation,\n                )\n            )\n        return discovered\n\n'''
          text = replace_once(text, '    async def discover(self) -> list[DiscoveredGroup]:\n', insertion + '    async def discover(self) -> list[DiscoveredGroup]:\n', 'provider fast methods')
          # Route full discovery through shared hydration without changing behavior.
          pattern = re.compile(r'    async def discover\(self\) -> list\[DiscoveredGroup\]:\n        snapshot = await self\._snapshots\.groups\(\)\n(?P<body>.*?)        return discovered\n', re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('missing patch anchor: provider discover body')
          text = text[:match.start()] + '    async def discover(self) -> list[DiscoveredGroup]:\n        return await self._hydrate(await self._snapshots.groups())\n' + text[match.end():]
          path.write_text(text)

          # Review persistence: fetch only rows that actually contain a draft.
          path = Path('backend/companion/duplicate_review_repository.py')
          text = path.read_text()
          text = replace_once(text, 'from sqlalchemy import select, update\n', 'from sqlalchemy import func, or_, select, update\n', 'review sqlalchemy imports')
          draft_method = '''    async def list_drafts(self) -> list[DuplicateGroupReviewRecord]:\n        \"\"\"Return only review rows carrying workspace draft state.\"\"\"\n\n        statement = (\n            select(DuplicateGroupReviewRecord)\n            .where(\n                or_(\n                    func.coalesce(\n                        func.json_array_length(DuplicateGroupReviewRecord.member_decisions), 0\n                    )\n                    > 0,\n                    DuplicateGroupReviewRecord.stack_primary_asset_id.is_not(None),\n                )\n            )\n            .order_by(\n                DuplicateGroupReviewRecord.discovery_source,\n                DuplicateGroupReviewRecord.stable_group_key,\n            )\n        )\n        async with self._database.sessions() as session:\n            return list((await session.scalars(statement)).all())\n\n'''
          text = replace_once(text, '    async def save(\n', draft_method + '    async def save(\n', 'list drafts')
          path.write_text(text)

          # Duplicate service: identity-only workspace restore + explicit-group validation.
          path = Path('backend/companion/duplicate_service.py')
          text = path.read_text()
          helper = '''    async def _groups_by_ids(self, group_ids: list[str]) -> list[DiscoveredGroup]:\n        unique_ids = list(dict.fromkeys(group_ids))\n        if not unique_ids:\n            return []\n        discover_groups = getattr(self._discovery, "discover_groups", None)\n        if callable(discover_groups):\n            return await discover_groups(unique_ids)\n        wanted = set(unique_ids)\n        return [group for group in await self._live_groups() if group.group_id in wanted]\n\n    async def _group_identities(\n        self,\n        *,\n        group_ids: list[str] | None = None,\n        stable_group_keys: list[str] | None = None,\n    ) -> list[Any] | None:\n        resolver = getattr(self._discovery, "resolve_identities", None)\n        if not callable(resolver):\n            return None\n        return await resolver(\n            group_ids=group_ids, stable_group_keys=stable_group_keys\n        )\n\n'''
          text = replace_once(text, '    async def result(\n', helper + '    async def result(\n', 'service group helpers')

          workspace_method = '''    async def workspace(\n        self,\n        options: DuplicateAnalysisOptions | None = None,\n    ) -> DuplicateWorkspaceState:\n        \"\"\"Restore durable selections/drafts without hydrating the duplicate universe.\"\"\"\n\n        if self._reviews is None:\n            raise RuntimeError("Duplicate review persistence is unavailable")\n        workspace = await self._reviews.get_workspace()\n        selected_references = list(getattr(workspace, "selected_groups", []) or [])\n        active_reference = getattr(workspace, "active_group", None)\n\n        parsed_references = [\n            DuplicateWorkspaceGroupReference.model_validate(raw)\n            for raw in selected_references\n        ]\n        parsed_active = (\n            DuplicateWorkspaceGroupReference.model_validate(active_reference)\n            if active_reference\n            else None\n        )\n\n        list_drafts = getattr(self._reviews, "list_drafts", None)\n        identities: list[Any] | None = None\n        records: list[Any] = []\n        if callable(list_drafts):\n            records = await list_drafts()\n            stable_keys = [\n                reference.stable_group_key\n                or stable_group_key(\n                    reference.discovery_source,\n                    reference.member_set_key or reference.member_fingerprint,\n                )\n                for reference in [*parsed_references, *([parsed_active] if parsed_active else [])]\n            ]\n            stable_keys.extend(record.stable_group_key for record in records)\n            identities = await self._group_identities(\n                stable_group_keys=list(dict.fromkeys(stable_keys))\n            )\n\n        if identities is None:\n            result = await self.result(options)\n            identities = list(result.groups)\n            records = []\n            for discovery_source in {group.discovery_source for group in result.groups}:\n                source_groups = [\n                    group for group in result.groups if group.discovery_source == discovery_source\n                ]\n                direct = await self._reviews.get_many(\n                    discovery_source,\n                    [group.stable_group_key for group in source_groups],\n                )\n                records.extend(direct.values())\n\n        def source_value(item: Any) -> str:\n            value = item.discovery_source\n            return value.value if isinstance(value, DiscoverySource) else str(value)\n\n        groups_by_stable_key = {item.stable_group_key: item for item in identities}\n        selected_ids: list[str] = []\n        stale_selected: list[DuplicateWorkspaceGroupReference] = []\n        for reference in parsed_references:\n            reference_key = reference.stable_group_key or stable_group_key(\n                reference.discovery_source,\n                reference.member_set_key or reference.member_fingerprint,\n            )\n            current = groups_by_stable_key.get(reference_key)\n            if (\n                current is not None\n                and source_value(current) == reference.discovery_source\n                and current.member_fingerprint == reference.member_fingerprint\n            ):\n                selected_ids.append(current.group_id)\n            else:\n                stale_selected.append(reference)\n\n        active_group_id = None\n        if parsed_active is not None:\n            active_key = parsed_active.stable_group_key or stable_group_key(\n                parsed_active.discovery_source,\n                parsed_active.member_set_key or parsed_active.member_fingerprint,\n            )\n            current = groups_by_stable_key.get(active_key)\n            if (\n                current is not None\n                and source_value(current) == parsed_active.discovery_source\n                and current.member_fingerprint == parsed_active.member_fingerprint\n            ):\n                active_group_id = current.group_id\n\n        drafts: list[DuplicateGroupDraft] = []\n        for record in records:\n            current = groups_by_stable_key.get(record.stable_group_key)\n            if current is None or source_value(current) != record.discovery_source:\n                continue\n            decisions = list(getattr(record, "member_decisions", []) or [])\n            if not decisions and not getattr(record, "stack_primary_asset_id", None):\n                continue\n            drafts.append(\n                DuplicateGroupDraft(\n                    group_id=current.group_id,\n                    discovery_source=source_value(current),\n                    member_fingerprint=record.member_fingerprint,\n                    decisions=decisions,\n                    stack_primary_asset_id=getattr(record, "stack_primary_asset_id", None),\n                    stack_resolution=getattr(record, "stack_resolution", "move_selected"),\n                    metadata_keeper_asset_id=getattr(\n                        record, "metadata_keeper_asset_id", None\n                    ),\n                    status=getattr(record, "draft_status", "pending"),\n                    stale=record.member_fingerprint != current.member_fingerprint,\n                )\n            )\n        return DuplicateWorkspaceState(\n            initialized=workspace is not None,\n            revision=int(getattr(workspace, "revision", 0) or 0),\n            selected_count=len(selected_ids),\n            selected_group_ids=selected_ids,\n            active_group_id=active_group_id,\n            stale_selected_groups=stale_selected,\n            drafts=drafts,\n        )\n\n'''
          pattern = re.compile(r'    async def workspace\(.*?\n    async def save_workspace_selection\(', re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('missing patch anchor: workspace method')
          text = text[:match.start()] + workspace_method + '    async def save_workspace_selection(' + text[match.end():]

          selection_method = '''    async def save_workspace_selection(\n        self,\n        request: DuplicateWorkspaceSelectionUpdate,\n    ) -> DuplicateWorkspaceState:\n        \"\"\"Save resolved group identities without materializing duplicate evidence.\"\"\"\n\n        if self._reviews is None:\n            raise RuntimeError("Duplicate review persistence is unavailable")\n        requested_ids = list(\n            dict.fromkeys(\n                [\n                    *request.selected_group_ids,\n                    *([request.active_group_id] if request.active_group_id else []),\n                ]\n            )\n        )\n        identities = await self._group_identities(group_ids=requested_ids)\n        if identities is None:\n            result = await self.result(request.options)\n            groups_by_id: dict[str, Any] = {group.group_id: group for group in result.groups}\n        else:\n            groups_by_id = {group.group_id: group for group in identities}\n        missing = [group_id for group_id in requested_ids if group_id not in groups_by_id]\n        if missing:\n            raise ActionPlanConflictError("A selected duplicate group is no longer available")\n\n        def reference(group_id: str) -> dict[str, str]:\n            group = groups_by_id[group_id]\n            source = group.discovery_source\n            source_value = source.value if isinstance(source, DiscoverySource) else str(source)\n            fingerprint = group.member_fingerprint\n            return DuplicateWorkspaceGroupReference(\n                group_id=group.group_id,\n                discovery_source=source_value,\n                member_fingerprint=fingerprint,\n                stable_group_key=group.stable_group_key,\n                member_set_key=getattr(group, "member_set_key", fingerprint),\n            ).model_dump(mode="json")\n\n        await self._reviews.save_workspace(\n            selected_groups=[reference(group_id) for group_id in request.selected_group_ids],\n            active_group=(\n                reference(request.active_group_id)\n                if request.active_group_id is not None\n                else None\n            ),\n            revision=request.revision,\n        )\n        return await self.workspace(request.options)\n\n'''
          pattern = re.compile(r'    async def save_workspace_selection\(.*?\n    async def update_workspace_selection\(', re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('missing patch anchor: save workspace selection')
          text = text[:match.start()] + selection_method + '    async def update_workspace_selection(' + text[match.end():]

          # Scope draft validation to one persisted group instead of the whole universe.
          text = replace_once(
              text,
              '        result = await self.result(request.options)\n        group = next(\n            (candidate for candidate in result.groups if candidate.group_id == request.group_id),\n            None,\n        )\n        if group is None or group.member_fingerprint != request.member_fingerprint:\n            raise ActionPlanConflictError("The duplicate group changed before its draft was saved")\n',
              '        options = await self._options(request.options)\n        groups = await self._groups_by_ids([request.group_id])\n        _, _, _, result = await self._snapshot_groups(groups, options)\n        group = next(\n            (candidate for candidate in result.groups if candidate.group_id == request.group_id),\n            None,\n        )\n        if group is None or group.member_fingerprint != request.member_fingerprint:\n            raise ActionPlanConflictError("The duplicate group changed before its draft was saved")\n',
              'single-group draft validation',
          )
          path.write_text(text)

          # Migration: bounded backfill so upgrades do not recreate a large transient allocation.
          migration = Path('backend/companion/migrations/versions/20260914_0045_composite_duplicate_identity.py')
          migration.write_text('''"""Persist stable composite duplicate identity for bounded workspace reads.\n\nRevision ID: 20260914_0045\nRevises: 20260914_0044\n"""\n\nfrom __future__ import annotations\n\nimport hashlib\n\nimport sqlalchemy as sa\nfrom alembic import op\n\nrevision = "20260914_0045"\ndown_revision = "20260914_0044"\nbranch_labels = None\ndepends_on = None\n\nBATCH_SIZE = 500\n\n\ndef _digest(value: str) -> str:\n    return hashlib.sha256(value.encode()).hexdigest()\n\n\ndef upgrade() -> None:\n    op.add_column(\n        "composite_duplicate_groups",\n        sa.Column("stable_group_key", sa.Text(), nullable=True),\n    )\n    op.add_column(\n        "composite_duplicate_groups",\n        sa.Column("member_fingerprint", sa.Text(), nullable=True),\n    )\n\n    bind = op.get_bind()\n    groups = sa.table(\n        "composite_duplicate_groups",\n        sa.column("group_id", sa.Text()),\n        sa.column("position", sa.Integer()),\n        sa.column("discovery_source", sa.String()),\n        sa.column("stable_group_key", sa.Text()),\n        sa.column("member_fingerprint", sa.Text()),\n    )\n    members = sa.table(\n        "composite_duplicate_group_members",\n        sa.column("group_id", sa.Text()),\n        sa.column("asset_id", sa.Uuid()),\n        sa.column("position", sa.Integer()),\n    )\n\n    last_position = -1\n    while True:\n        group_rows = bind.execute(\n            sa.select(groups.c.group_id, groups.c.position, groups.c.discovery_source)\n            .where(groups.c.position > last_position)\n            .order_by(groups.c.position)\n            .limit(BATCH_SIZE)\n        ).mappings().all()\n        if not group_rows:\n            break\n        group_ids = [row["group_id"] for row in group_rows]\n        member_rows = bind.execute(\n            sa.select(members.c.group_id, members.c.asset_id)\n            .where(members.c.group_id.in_(group_ids))\n            .order_by(members.c.group_id, members.c.position)\n        ).all()\n        by_group: dict[str, list[str]] = {}\n        for group_id, asset_id in member_rows:\n            by_group.setdefault(group_id, []).append(str(asset_id))\n        updates = []\n        for row in group_rows:\n            fingerprint = _digest(",".join(sorted(set(by_group.get(row["group_id"], [])))))\n            updates.append(\n                {\n                    "target_group_id": row["group_id"],\n                    "stable_key": _digest(f'{row["discovery_source"]}:{fingerprint}'),\n                    "fingerprint": fingerprint,\n                }\n            )\n        bind.execute(\n            sa.update(groups)\n            .where(groups.c.group_id == sa.bindparam("target_group_id"))\n            .values(\n                stable_group_key=sa.bindparam("stable_key"),\n                member_fingerprint=sa.bindparam("fingerprint"),\n            ),\n            updates,\n        )\n        last_position = int(group_rows[-1]["position"])\n\n    op.alter_column("composite_duplicate_groups", "stable_group_key", nullable=False)\n    op.alter_column("composite_duplicate_groups", "member_fingerprint", nullable=False)\n    op.create_index(\n        "ix_composite_duplicate_groups_stable_group_key",\n        "composite_duplicate_groups",\n        ["stable_group_key"],\n    )\n\n\ndef downgrade() -> None:\n    op.drop_index(\n        "ix_composite_duplicate_groups_stable_group_key",\n        table_name="composite_duplicate_groups",\n    )\n    op.drop_column("composite_duplicate_groups", "member_fingerprint")\n    op.drop_column("composite_duplicate_groups", "stable_group_key")\n''')

          # Focused service regression: workspace/draft fast paths must never call full discovery.
          test_path = Path('backend/tests/test_duplicate_service.py')
          test = test_path.read_text()
          test += '''\n\n@pytest.mark.asyncio\nasync def test_persisted_workspace_and_draft_paths_do_not_materialize_all_groups() -> None:\n    content = b"same"\n    candidate_group = group(\n        asset(UPLOAD_1, external=False, checksum=immich_sha1(content), filename="one.jpg"),\n        asset(EXTERNAL_1, external=True, checksum="path", filename="two.jpg"),\n    )\n    discovered = DiscoveredGroup(\n        group_id=PUBLIC_GROUP_ID,\n        discovery_source=DiscoverySource.IMMICH_DUPLICATE,\n        provider_group_id=str(GROUP_ID),\n        assets=tuple(candidate_group.assets),\n    )\n    assembled = assemble(candidate_group, [report(EXTERNAL_1, content)]).groups[0]\n    identity = SimpleNamespace(\n        group_id=PUBLIC_GROUP_ID,\n        discovery_source=DiscoverySource.IMMICH_DUPLICATE,\n        provider_group_id=str(GROUP_ID),\n        stable_group_key=assembled.stable_group_key,\n        member_set_key=assembled.member_set_key,\n        member_fingerprint=assembled.member_fingerprint,\n    )\n\n    class PersistedDiscovery:\n        full_calls = 0\n        group_calls = 0\n        identity_calls = 0\n\n        async def discover(self):\n            self.full_calls += 1\n            raise AssertionError("workspace/draft path must not discover the full duplicate universe")\n\n        async def discover_groups(self, group_ids):\n            self.group_calls += 1\n            return [discovered] if PUBLIC_GROUP_ID in group_ids else []\n\n        async def resolve_identities(self, *, group_ids=None, stable_group_keys=None):\n            self.identity_calls += 1\n            if group_ids is not None and PUBLIC_GROUP_ID not in group_ids:\n                return []\n            if stable_group_keys is not None and assembled.stable_group_key not in stable_group_keys:\n                return []\n            return [identity]\n\n    class PersistedReviews(FakeReviews):\n        async def list_drafts(self):\n            return [self.record] if self.record is not None else []\n\n    discovery = PersistedDiscovery()\n    reviews = PersistedReviews()\n    reviews.workspace_record = SimpleNamespace(\n        revision=3,\n        selected_groups=[\n            {\n                "group_id": PUBLIC_GROUP_ID,\n                "discovery_source": "immich_duplicate",\n                "member_fingerprint": assembled.member_fingerprint,\n                "stable_group_key": assembled.stable_group_key,\n                "member_set_key": assembled.member_set_key,\n            }\n        ],\n        active_group={\n            "group_id": PUBLIC_GROUP_ID,\n            "discovery_source": "immich_duplicate",\n            "member_fingerprint": assembled.member_fingerprint,\n            "stable_group_key": assembled.stable_group_key,\n            "member_set_key": assembled.member_set_key,\n        },\n    )\n    reviews.record = SimpleNamespace(\n        discovery_source="immich_duplicate",\n        provider_group_id=str(GROUP_ID),\n        stable_group_key=assembled.stable_group_key,\n        member_fingerprint=assembled.member_fingerprint,\n        member_decisions=[\n            {\n                "asset_id": str(UPLOAD_1),\n                "disposition": "keep",\n                "source": "manual",\n                "status": "pending",\n            }\n        ],\n        stack_primary_asset_id=None,\n        stack_resolution="move_selected",\n        metadata_keeper_asset_id=None,\n        draft_status="pending",\n    )\n    service = CrossSourceDuplicateService(\n        SimpleNamespace(action_plan_ttl_seconds=900),\n        FakeImmich(candidate_group),\n        FakeAssets(),\n        FakeReports([report(EXTERNAL_1, content)]),\n        FakeActions(),\n        FakeTasks(),\n        SimpleNamespace(),\n        reviews,\n        discovery=discovery,\n    )\n\n    restored = await service.workspace()\n    assert restored.selected_group_ids == [PUBLIC_GROUP_ID]\n    assert restored.active_group_id == PUBLIC_GROUP_ID\n    assert restored.drafts[0].group_id == PUBLIC_GROUP_ID\n    assert discovery.full_calls == 0\n    assert discovery.identity_calls == 1\n\n    await service.save_group_draft(\n        DuplicateGroupDraftUpdate(\n            group_id=PUBLIC_GROUP_ID,\n            member_fingerprint=assembled.member_fingerprint,\n            decisions=[\n                DuplicateMemberDraftDecision(asset_id=UPLOAD_1, disposition="keep"),\n                DuplicateMemberDraftDecision(asset_id=EXTERNAL_1, disposition="delete"),\n            ],\n        )\n    )\n    assert discovery.full_calls == 0\n    assert discovery.group_calls == 1\n'''
          test_path.write_text(test)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-duplicate-workspace-fastpath.yml
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "perf: bound duplicate workspace restoration"
          git push origin HEAD:feat/v2-shell
