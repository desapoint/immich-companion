name: Retry duplicate SQL sorts

on:
  push:
    branches:
      - feat/v2-shell
    paths:
      - .github/workflows/retry-duplicate-sorts.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v2-shell

      - name: Apply and normalize duplicate sort slice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from textwrap import dedent, indent

          workflow = Path('.github/workflows/apply-duplicate-sorts.yml').read_text()
          block = re.search(
              r"      - name: Apply duplicate sort slice\n        shell: bash\n        run: \|\n(?P<body>.*?)(?=\n      - uses: actions/setup-python@v6)",
              workflow,
              re.S,
          )
          if block is None:
              raise SystemExit('Could not recover duplicate sort patch')
          body = dedent(block.group('body'))
          marker = "python - <<'PY'\n"
          start = body.index(marker) + len(marker)
          end = body.rindex("\nPY")
          patch = body[start:end]
          exec(compile(patch, '<duplicate-sort-patch>', 'exec'))

          repo_path = Path('backend/companion/composite_duplicate_repository.py')
          repo = repo_path.read_text()
          repo = re.sub(
              r'^\s+def _validation_payload\(validation: ValidatedSimilarityGroup \| None\) -> dict\[str, Any\] \| None:',
              'def _validation_payload(validation: ValidatedSimilarityGroup | None) -> dict[str, Any] | None:',
              repo,
              flags=re.M,
          )
          sort_block = dedent('''
          sort_column = {
              "reclaimable": CompositeDuplicateGroupRecord.reclaimable_bytes,
              "members": CompositeDuplicateGroupRecord.member_count,
              "similarity": CompositeDuplicateGroupRecord.similarity_score,
              "newest": CompositeDuplicateGroupRecord.newest_taken_at,
              "oldest": CompositeDuplicateGroupRecord.oldest_taken_at,
              "discovered": CompositeDuplicateGroupRecord.first_discovered_at,
          }.get(sort, CompositeDuplicateGroupRecord.reclaimable_bytes)
          order = sort_column.desc() if direction == "desc" else sort_column.asc()
          group_statement = (
              select(CompositeDuplicateGroupRecord)
              .order_by(
                  order.nulls_last(),
                  CompositeDuplicateGroupRecord.group_id.asc(),
              )
              .offset(offset)
              .limit(page_size)
          )
          ''').strip()
          repo, count = re.subn(
              r'(?ms)^\s*sort_column = \{.*?^\s*group_statement = \(.*?^\s*\.limit\(page_size\)\n^\s*\)',
              indent(sort_block, '            '),
              repo,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not normalize repository sort block')
          repo_path.write_text(repo)

          service_path = Path('backend/companion/duplicate_service.py')
          service = service_path.read_text()
          fallback = dedent('''
          def sort_value(group: DiscoveredGroup):
              if sort == "members":
                  return len(group.assets)
              if sort == "similarity":
                  return (
                      group.similarity_validation.minimum_similarity_percent
                      if group.similarity_validation is not None
                      else None
                  )
              if sort == "newest":
                  return max((asset.file_created_at for asset in group.assets), default=None)
              if sort == "oldest":
                  return min((asset.file_created_at for asset in group.assets), default=None)
              if sort == "discovered":
                  return None
              sizes = [asset.file_size_bytes for asset in group.assets]
              return (
                  sum(size for size in sizes if size is not None)
                  - max(size for size in sizes if size is not None)
                  if sizes and all(size is not None for size in sizes)
                  else None
              )

          known = [(sort_value(group), group) for group in all_groups]
          missing = sorted(
              (group for value, group in known if value is None),
              key=lambda group: group.group_id,
          )
          ordered = [(value, group) for value, group in known if value is not None]
          ordered.sort(key=lambda item: item[1].group_id)
          ordered.sort(key=lambda item: item[0], reverse=direction == "desc")
          all_groups = [group for _, group in ordered] + missing
          total = len(all_groups)
          resolved_page = page
          ''').strip()
          service, count = re.subn(
              r'(?ms)^\s*def sort_value\(group: DiscoveredGroup\):.*?^\s*resolved_page = page',
              indent(fallback, '            '),
              service,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not normalize fallback sort block')
          service_path.write_text(service)

          test_path = Path('backend/tests/test_composite_duplicate_sync.py')
          test = test_path.read_text()
          test = re.sub(
              r'^\s+@pytest\.mark\.asyncio\n\s+async def test_rebuild_handler_materializes_source_discovery_once\(\) -> None:',
              '@pytest.mark.asyncio\nasync def test_rebuild_handler_materializes_source_discovery_once() -> None:',
              test,
              flags=re.M,
          )
          test_path.write_text(test)

          for path in (
              'backend/companion/composite_duplicate_repository.py',
              'backend/companion/discovery/persisted_composite.py',
              'backend/companion/duplicate_service.py',
              'backend/companion/main.py',
              'backend/companion/migrations/versions/20260914_0046_composite_duplicate_sort_fields.py',
              'backend/tests/test_composite_duplicate_sync.py',
          ):
              compile(Path(path).read_text(), path, 'exec')
          PY

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Validate backend
        shell: bash
        run: |
          python -m pip install -e './backend[dev]'
          cd backend
          ruff format companion/composite_duplicate_repository.py companion/discovery/persisted_composite.py companion/duplicate_service.py companion/main.py companion/migrations/versions/20260914_0046_composite_duplicate_sort_fields.py tests/test_composite_duplicate_sync.py
          ruff check --fix companion/composite_duplicate_repository.py companion/discovery/persisted_composite.py companion/duplicate_service.py companion/main.py companion/migrations/versions/20260914_0046_composite_duplicate_sort_fields.py tests/test_composite_duplicate_sync.py
          pytest
          ruff check companion tests

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend
        shell: bash
        run: |
          cd frontend
          npm ci
          npm run check
          npm test

      - name: Commit validated implementation
        shell: bash
        run: |
          rm -f .github/workflows/apply-duplicate-sorts.yml .github/workflows/retry-duplicate-sorts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend frontend .github/workflows/apply-duplicate-sorts.yml .github/workflows/retry-duplicate-sorts.yml
          git commit -m 'feat: add SQL-backed duplicate sorting'
          git push origin HEAD:feat/v2-shell
