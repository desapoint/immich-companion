name: Apply duplicate SQL sorts

on:
  push:
    branches:
      - feat/v2-shell
    paths:
      - .github/workflows/apply-duplicate-sorts.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v2-shell

      - name: Apply duplicate sort slice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Missing patch anchor in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          repo = "backend/companion/composite_duplicate_repository.py"
          replace_once(
              repo,
              "    DateTime,\n    ForeignKey,",
              "    DateTime,\n    Float,\n    ForeignKey,",
          )
          replace_once(
              repo,
              "    member_fingerprint: Mapped[str] = mapped_column(String(64), nullable=False)\n    provider_metadata: Mapped[dict[str, Any]] = mapped_column(JSON, nullable=False, default=dict)",
              "    member_fingerprint: Mapped[str] = mapped_column(String(64), nullable=False)\n    member_count: Mapped[int] = mapped_column(Integer, nullable=False, index=True)\n    reclaimable_bytes: Mapped[int | None] = mapped_column(BigInteger, nullable=True, index=True)\n    similarity_score: Mapped[float | None] = mapped_column(Float, nullable=True, index=True)\n    oldest_taken_at: Mapped[datetime | None] = mapped_column(DateTime(timezone=True), nullable=True, index=True)\n    newest_taken_at: Mapped[datetime | None] = mapped_column(DateTime(timezone=True), nullable=True, index=True)\n    first_discovered_at: Mapped[datetime] = mapped_column(DateTime(timezone=True), nullable=False, index=True)\n    provider_metadata: Mapped[dict[str, Any]] = mapped_column(JSON, nullable=False, default=dict)",
          )
          replace_once(
              repo,
              "\ndef _validation_payload(validation: ValidatedSimilarityGroup | None) -> dict[str, Any] | None:\n",
              dedent('''
              \ndef _group_projection_summary(group: DiscoveredGroup) -> dict[str, Any]:
                  """Return small SQL-sortable values without retaining duplicate group objects."""

                  sizes = [asset.file_size_bytes for asset in group.assets]
                  reclaimable_bytes = (
                      sum(size for size in sizes if size is not None)
                      - max(size for size in sizes if size is not None)
                      if sizes and all(size is not None for size in sizes)
                      else None
                  )
                  capture_times = [asset.file_created_at for asset in group.assets]
                  return {
                      "member_count": len(group.assets),
                      "reclaimable_bytes": reclaimable_bytes,
                      "similarity_score": (
                          group.similarity_validation.minimum_similarity_percent
                          if group.similarity_validation is not None
                          else None
                      ),
                      "oldest_taken_at": min(capture_times) if capture_times else None,
                      "newest_taken_at": max(capture_times) if capture_times else None,
                  }


              def _validation_payload(validation: ValidatedSimilarityGroup | None) -> dict[str, Any] | None:
              '''),
          )
          replace_once(
              repo,
              "        source: DiscoverySource | None = None,\n    ) -> CompositeDuplicateSnapshotPage:",
              "        source: DiscoverySource | None = None,\n        sort: str = \"reclaimable\",\n        direction: str = \"desc\",\n    ) -> CompositeDuplicateSnapshotPage:",
          )
          replace_once(
              repo,
              "            group_statement = (\n                select(CompositeDuplicateGroupRecord)\n                .order_by(CompositeDuplicateGroupRecord.position)\n                .offset(offset)\n                .limit(page_size)\n            )",
              dedent('''
                          sort_column = {
                              "reclaimable": CompositeDuplicateGroupRecord.reclaimable_bytes,
                              "members": CompositeDuplicateGroupRecord.member_count,
                              "similarity": CompositeDuplicateGroupRecord.similarity_score,
                              "newest": CompositeDuplicateGroupRecord.newest_taken_at,
                              "oldest": CompositeDuplicateGroupRecord.oldest_taken_at,
                              "discovered": CompositeDuplicateGroupRecord.first_discovered_at,
                          }.get(sort, CompositeDuplicateGroupRecord.reclaimable_bytes)
                          order = sort_column.desc() if direction == "desc" else sort_column.asc()
                          group_statement = (
                              select(CompositeDuplicateGroupRecord)
                              .order_by(
                                  order.nulls_last(),
                                  CompositeDuplicateGroupRecord.group_id.asc(),
                              )
                              .offset(offset)
                              .limit(page_size)
                          )
              ''').rstrip(),
          )
          replace_once(
              repo,
              "            for position, group in enumerate(groups):\n                fingerprint = member_set_key(asset.id for asset in group.assets)\n                group_rows.append(\n                    {",
              "            for position, group in enumerate(groups):\n                fingerprint = member_set_key(asset.id for asset in group.assets)\n                summary = _group_projection_summary(group)\n                group_rows.append(\n                    {",
          )
          replace_once(
              repo,
              '                        "member_fingerprint": fingerprint,\n                        "provider_metadata": dict(group.provider_metadata),',
              '                        "member_fingerprint": fingerprint,\n                        **summary,\n                        "first_discovered_at": now,\n                        "provider_metadata": dict(group.provider_metadata),',
          )
          replace_once(
              repo,
              '                            "member_fingerprint": statement.excluded.member_fingerprint,\n                            "provider_metadata": statement.excluded.provider_metadata,',
              '                            "member_fingerprint": statement.excluded.member_fingerprint,\n                            "member_count": statement.excluded.member_count,\n                            "reclaimable_bytes": statement.excluded.reclaimable_bytes,\n                            "similarity_score": statement.excluded.similarity_score,\n                            "oldest_taken_at": statement.excluded.oldest_taken_at,\n                            "newest_taken_at": statement.excluded.newest_taken_at,\n                            "provider_metadata": statement.excluded.provider_metadata,',
          )

          provider = "backend/companion/discovery/persisted_composite.py"
          replace_once(
              provider,
              "        source: DiscoverySource | None = None,\n    ) -> CompositeDuplicateSnapshotPage: ...",
              "        source: DiscoverySource | None = None,\n        sort: str = \"reclaimable\",\n        direction: str = \"desc\",\n    ) -> CompositeDuplicateSnapshotPage: ...",
          )
          replace_once(
              provider,
              "        source: str = \"both\",\n    ) -> DiscoveredGroupPage:",
              "        source: str = \"both\",\n        sort: str = \"reclaimable\",\n        direction: str = \"desc\",\n    ) -> DiscoveredGroupPage:",
          )
          replace_once(
              provider,
              "            source=source_value,\n        )",
              "            source=source_value,\n            sort=sort,\n            direction=direction,\n        )",
          )

          service = "backend/companion/duplicate_service.py"
          replace_once(
              service,
              '        source: Literal["both", "immich", "similarity"] = "both",\n    ) -> DuplicateSearchPage:',
              '        source: Literal["both", "immich", "similarity"] = "both",\n        sort: Literal["reclaimable", "members", "similarity", "newest", "oldest", "discovered"] = "reclaimable",\n        direction: Literal["asc", "desc"] = "desc",\n    ) -> DuplicateSearchPage:',
          )
          replace_once(
              service,
              "                source=source,\n            )",
              "                source=source,\n                sort=sort,\n                direction=direction,\n            )",
          )
          replace_once(
              service,
              "            total = len(all_groups)\n            resolved_page = page",
              dedent('''
                          def sort_value(group: DiscoveredGroup):
                              if sort == "members":
                                  return len(group.assets)
                              if sort == "similarity":
                                  return (
                                      group.similarity_validation.minimum_similarity_percent
                                      if group.similarity_validation is not None
                                      else None
                                  )
                              if sort == "newest":
                                  return max((asset.file_created_at for asset in group.assets), default=None)
                              if sort == "oldest":
                                  return min((asset.file_created_at for asset in group.assets), default=None)
                              if sort == "discovered":
                                  return None
                              sizes = [asset.file_size_bytes for asset in group.assets]
                              return (
                                  sum(size for size in sizes if size is not None)
                                  - max(size for size in sizes if size is not None)
                                  if sizes and all(size is not None for size in sizes)
                                  else None
                              )

                          known = [(sort_value(group), group) for group in all_groups]
                          missing = sorted(
                              (group for value, group in known if value is None),
                              key=lambda group: group.group_id,
                          )
                          ordered = [(value, group) for value, group in known if value is not None]
                          ordered.sort(key=lambda item: item[1].group_id)
                          ordered.sort(key=lambda item: item[0], reverse=direction == "desc")
                          all_groups = [group for _, group in ordered] + missing
                          total = len(all_groups)
                          resolved_page = page
              ''').rstrip(),
          )

          main = "backend/companion/main.py"
          replace_once(
              main,
              '        source: Literal["both", "immich", "similarity"] = Query(default="both"),\n    ) -> DuplicateSearchPage:',
              '        source: Literal["both", "immich", "similarity"] = Query(default="both"),\n        sort: Literal["reclaimable", "members", "similarity", "newest", "oldest", "discovered"] = Query(default="reclaimable"),\n        direction: Literal["asc", "desc"] = Query(default="desc"),\n    ) -> DuplicateSearchPage:',
          )
          replace_once(
              main,
              "                source=source,\n            )\n        except ImmichApiError as error:",
              "                source=source,\n                sort=sort,\n                direction=direction,\n            )\n        except ImmichApiError as error:",
          )

          contracts = "frontend/src/v2/data/contracts.ts"
          replace_once(
              contracts,
              "export type DuplicateSearchQuery = CollectionRequest & { state?: DuplicateState | 'All groups' | 'Auto-ready'; source?: DuplicateSourceFilter; reuseCachedGroups?: boolean };",
              "export type DuplicateSort = { field: 'reclaimable' | 'members' | 'similarity' | 'newest' | 'oldest' | 'discovered'; direction: 'asc' | 'desc' }; export type DuplicateSearchQuery = CollectionRequest & { state?: DuplicateState | 'All groups' | 'Auto-ready'; source?: DuplicateSourceFilter; sort?: DuplicateSort; reuseCachedGroups?: boolean };",
          )

          frontend_repo = "frontend/src/v2/data/api/duplicateRepository.ts"
          replace_once(
              frontend_repo,
              "          source: query.source ?? 'both',\n        });",
              "          source: query.source ?? 'both',\n          sort: query.sort?.field ?? 'reclaimable',\n          direction: query.sort?.direction ?? 'desc',\n        });",
          )

          page = "frontend/src/v2/pages/V2DuplicatesPage.svelte"
          replace_once(
              page,
              "  type DuplicateTab='Review'|'Rules & discovery'|'Resolution history';\n",
              "  type DuplicateTab='Review'|'Rules & discovery'|'Resolution history';\n  type DuplicateSortField='reclaimable'|'members'|'similarity'|'newest'|'oldest'|'discovered';\n",
          )
          replace_once(
              page,
              "  let decisions=$state<Record<string,DuplicateDecision>>({}),stackWorkspace=$state(createDuplicateStackWorkspace()),selectedGroups=$state<string[]>([]),reviewFilter=$state<DuplicateState|'All groups'|'Auto-ready'>('All groups');",
              "  let decisions=$state<Record<string,DuplicateDecision>>({}),stackWorkspace=$state(createDuplicateStackWorkspace()),selectedGroups=$state<string[]>([]),reviewFilter=$state<DuplicateState|'All groups'|'Auto-ready'>('All groups'),sort=$state('reclaimable:desc');",
          )
          replace_once(
              page,
              "  async function refreshGroups(reset=true,reuseCachedGroups=false):Promise<boolean>{",
              "  function parseSort():{field:DuplicateSortField;direction:'asc'|'desc'}{const[fieldRaw,directionRaw]=sort.split(':');const field=(['reclaimable','members','similarity','newest','oldest','discovered'].includes(fieldRaw)?fieldRaw:'reclaimable') as DuplicateSortField;return{field,direction:directionRaw==='asc'?'asc':'desc'}}\n  async function refreshGroups(reset=true,reuseCachedGroups=false):Promise<boolean>{",
          )
          replace_once(
              page,
              "const query=collection.resultMode==='Pagination'?{state:reviewFilter,source:sourceFilter,page:collection.page,pageSize:collection.pageSize,reuseCachedGroups}:{state:reviewFilter,source:sourceFilter,pageSize:collection.pageSize,cursor:reset?null:nextCursor,reuseCachedGroups};",
              "const query=collection.resultMode==='Pagination'?{state:reviewFilter,source:sourceFilter,sort:parseSort(),page:collection.page,pageSize:collection.pageSize,reuseCachedGroups}:{state:reviewFilter,source:sourceFilter,sort:parseSort(),pageSize:collection.pageSize,cursor:reset?null:nextCursor,reuseCachedGroups};",
          )
          replace_once(
              page,
              "  function setMode(value:ResultMode){collection.setMode(value);void refreshGroups(true,true)}\n  function setReviewFilter",
              "  function setMode(value:ResultMode){collection.setMode(value);void refreshGroups(true,true)}\n  function setSort(value:string){sort=value;collection.reset();interactionError='';void refreshGroups(true,true)}\n  function setReviewFilter",
          )
          replace_once(
              page,
              '<V2CollectionControls id="duplicate-results" sort="state:asc" sortFields={[]} pageSize={collection.pageSize} pageSizes={[6,12,24,48,96,192]} batchLabel="page" resultMode={collection.resultMode} onsort={()=>{}} onpagesize={setPageSize} onmode={setMode}/>',
              '<V2CollectionControls id="duplicate-results" {sort} sortFields={reviewFilter===\'All groups\'?[{value:\'reclaimable\',label:\'Reclaimable space\'},{value:\'members\',label:\'Group size\'},{value:\'similarity\',label:\'Similarity\'},{value:\'newest\',label:\'Newest\'},{value:\'oldest\',label:\'Oldest\'},{value:\'discovered\',label:\'Recently discovered\'}]:[]} pageSize={collection.pageSize} pageSizes={[6,12,24,48,96,192]} batchLabel="page" resultMode={collection.resultMode} onsort={setSort} onpagesize={setPageSize} onmode={setMode}/>',
          )

          test = "backend/tests/test_composite_duplicate_sync.py"
          replace_once(
              test,
              "    CompositeDuplicateSnapshotPage,\n)",
              "    CompositeDuplicateSnapshotPage,\n    _group_projection_summary,\n)",
          )
          replace_once(
              test,
              '        source="similarity",\n    )',
              '        source="similarity",\n        sort="similarity",\n        direction="asc",\n    )',
          )
          replace_once(
              test,
              '        "source": DiscoverySource.COMPANION_SIMILARITY,\n    }',
              '        "source": DiscoverySource.COMPANION_SIMILARITY,\n        "sort": "similarity",\n        "direction": "asc",\n    }',
          )
          replace_once(
              test,
              "\n\n@pytest.mark.asyncio\nasync def test_rebuild_handler_materializes_source_discovery_once() -> None:\n",
              dedent('''

              def test_projection_summary_supports_database_sorts() -> None:
                  first = asset(ASSET_1).model_copy(
                      update={"exif_info": {"fileSizeInByte": 400}}
                  )
                  second = asset(ASSET_2).model_copy(
                      update={"exif_info": {"fileSizeInByte": 100}}
                  )
                  group = DiscoveredGroup(
                      group_id="companion:similarity:summary",
                      discovery_source=DiscoverySource.COMPANION_SIMILARITY,
                      provider_group_id="scan-summary",
                      assets=(first, second),
                      similarity_validation=validation(),
                  )

                  summary = _group_projection_summary(group)

                  assert summary["member_count"] == 2
                  assert summary["reclaimable_bytes"] == 100
                  assert summary["similarity_score"] == 91.0
                  assert summary["oldest_taken_at"] == NOW
                  assert summary["newest_taken_at"] == NOW


              @pytest.mark.asyncio
              async def test_rebuild_handler_materializes_source_discovery_once() -> None:
              '''),
          )

          frontend_test = "frontend/src/v2/data/api/duplicateRepository.test.ts"
          replace_once(
              frontend_test,
              "    let currentGroups = [group, secondGroup];\n    const fetcher",
              "    let currentGroups = [group, secondGroup];\n    const pageRequests: URL[] = [];\n    const fetcher",
          )
          replace_once(
              frontend_test,
              "        const url = new URL(path, 'http://localhost');\n        const page = Number",
              "        const url = new URL(path, 'http://localhost');\n        pageRequests.push(url);\n        const page = Number",
          )
          replace_once(
              frontend_test,
              "    expect((await repository.search({ page: 1, pageSize: 1 })).total).toBe(2);\n    currentGroups",
              "    expect((await repository.search({ page: 1, pageSize: 1 })).total).toBe(2);\n    expect(pageRequests[0]?.searchParams.get('sort')).toBe('reclaimable');\n    expect(pageRequests[0]?.searchParams.get('direction')).toBe('desc');\n    currentGroups",
          )
          replace_once(
              frontend_test,
              "    expect(refreshed.total).toBe(1);\n    expect(fetcher).toHaveBeenCalledTimes(6);\n  });",
              "    expect(refreshed.total).toBe(1);\n    expect(fetcher).toHaveBeenCalledTimes(6);\n\n    await repository.search({ page: 1, pageSize: 1, reuseCachedGroups: true, sort: { field: 'similarity', direction: 'asc' } });\n    expect(pageRequests.at(-1)?.searchParams.get('sort')).toBe('similarity');\n    expect(pageRequests.at(-1)?.searchParams.get('direction')).toBe('asc');\n  });",
          )

          migration = Path("backend/companion/migrations/versions/20260914_0046_composite_duplicate_sort_fields.py")
          migration.write_text(dedent('''
          """Persist list-level duplicate sort summaries.

          Revision ID: 20260914_0046
          Revises: 20260914_0045
          """

          from __future__ import annotations

          import sqlalchemy as sa
          from alembic import op

          revision = "20260914_0046"
          down_revision = "20260914_0045"
          branch_labels = None
          depends_on = None

          BATCH_SIZE = 500


          def upgrade() -> None:
              op.add_column(
                  "composite_duplicate_groups",
                  sa.Column("member_count", sa.Integer(), nullable=True),
              )
              op.add_column(
                  "composite_duplicate_groups",
                  sa.Column("reclaimable_bytes", sa.BigInteger(), nullable=True),
              )
              op.add_column(
                  "composite_duplicate_groups",
                  sa.Column("similarity_score", sa.Float(), nullable=True),
              )
              op.add_column(
                  "composite_duplicate_groups",
                  sa.Column("oldest_taken_at", sa.DateTime(timezone=True), nullable=True),
              )
              op.add_column(
                  "composite_duplicate_groups",
                  sa.Column("newest_taken_at", sa.DateTime(timezone=True), nullable=True),
              )
              op.add_column(
                  "composite_duplicate_groups",
                  sa.Column("first_discovered_at", sa.DateTime(timezone=True), nullable=True),
              )

              bind = op.get_bind()
              groups = sa.table(
                  "composite_duplicate_groups",
                  sa.column("group_id", sa.Text()),
                  sa.column("position", sa.Integer()),
                  sa.column("similarity_validation", sa.JSON()),
                  sa.column("synced_at", sa.DateTime(timezone=True)),
                  sa.column("member_count", sa.Integer()),
                  sa.column("reclaimable_bytes", sa.BigInteger()),
                  sa.column("similarity_score", sa.Float()),
                  sa.column("oldest_taken_at", sa.DateTime(timezone=True)),
                  sa.column("newest_taken_at", sa.DateTime(timezone=True)),
                  sa.column("first_discovered_at", sa.DateTime(timezone=True)),
              )
              members = sa.table(
                  "composite_duplicate_group_members",
                  sa.column("group_id", sa.Text()),
                  sa.column("asset_id", sa.Uuid()),
              )
              assets = sa.table(
                  "assets",
                  sa.column("id", sa.Uuid()),
                  sa.column("file_size_bytes", sa.BigInteger()),
                  sa.column("file_created_at", sa.DateTime(timezone=True)),
              )

              last_position = -1
              while True:
                  group_rows = bind.execute(
                      sa.select(
                          groups.c.group_id,
                          groups.c.position,
                          groups.c.similarity_validation,
                          groups.c.synced_at,
                      )
                      .where(groups.c.position > last_position)
                      .order_by(groups.c.position)
                      .limit(BATCH_SIZE)
                  ).mappings().all()
                  if not group_rows:
                      break
                  group_ids = [row["group_id"] for row in group_rows]
                  member_rows = bind.execute(
                      sa.select(
                          members.c.group_id,
                          assets.c.file_size_bytes,
                          assets.c.file_created_at,
                      )
                      .select_from(
                          members.join(assets, assets.c.id == members.c.asset_id)
                      )
                      .where(members.c.group_id.in_(group_ids))
                  ).all()
                  by_group: dict[str, list[tuple[int | None, object]]] = {}
                  for group_id, file_size_bytes, file_created_at in member_rows:
                      by_group.setdefault(group_id, []).append(
                          (file_size_bytes, file_created_at)
                      )

                  updates = []
                  for row in group_rows:
                      values = by_group.get(row["group_id"], [])
                      sizes = [value[0] for value in values]
                      dates = [value[1] for value in values if value[1] is not None]
                      validation = row["similarity_validation"]
                      score = (
                          validation.get("minimum_similarity_percent")
                          if isinstance(validation, dict)
                          else None
                      )
                      updates.append(
                          {
                              "target_group_id": row["group_id"],
                              "member_count_value": len(values),
                              "reclaimable_value": (
                                  sum(size for size in sizes if size is not None)
                                  - max(size for size in sizes if size is not None)
                                  if sizes and all(size is not None for size in sizes)
                                  else None
                              ),
                              "similarity_value": float(score) if score is not None else None,
                              "oldest_value": min(dates) if dates else None,
                              "newest_value": max(dates) if dates else None,
                              "first_discovered_value": row["synced_at"],
                          }
                      )
                  bind.execute(
                      sa.update(groups)
                      .where(groups.c.group_id == sa.bindparam("target_group_id"))
                      .values(
                          member_count=sa.bindparam("member_count_value"),
                          reclaimable_bytes=sa.bindparam("reclaimable_value"),
                          similarity_score=sa.bindparam("similarity_value"),
                          oldest_taken_at=sa.bindparam("oldest_value"),
                          newest_taken_at=sa.bindparam("newest_value"),
                          first_discovered_at=sa.bindparam("first_discovered_value"),
                      ),
                      updates,
                  )
                  last_position = int(group_rows[-1]["position"])

              op.alter_column("composite_duplicate_groups", "member_count", nullable=False)
              op.alter_column(
                  "composite_duplicate_groups", "first_discovered_at", nullable=False
              )
              for name in (
                  "member_count",
                  "reclaimable_bytes",
                  "similarity_score",
                  "oldest_taken_at",
                  "newest_taken_at",
                  "first_discovered_at",
              ):
                  op.create_index(
                      f"ix_composite_duplicate_groups_{name}",
                      "composite_duplicate_groups",
                      [name],
                  )


          def downgrade() -> None:
              for name in reversed(
                  (
                      "member_count",
                      "reclaimable_bytes",
                      "similarity_score",
                      "oldest_taken_at",
                      "newest_taken_at",
                      "first_discovered_at",
                  )
              ):
                  op.drop_index(
                      f"ix_composite_duplicate_groups_{name}",
                      table_name="composite_duplicate_groups",
                  )
              op.drop_column("composite_duplicate_groups", "first_discovered_at")
              op.drop_column("composite_duplicate_groups", "newest_taken_at")
              op.drop_column("composite_duplicate_groups", "oldest_taken_at")
              op.drop_column("composite_duplicate_groups", "similarity_score")
              op.drop_column("composite_duplicate_groups", "reclaimable_bytes")
              op.drop_column("composite_duplicate_groups", "member_count")
          ''').lstrip())
          PY

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Validate backend
        shell: bash
        run: |
          python -m pip install -e './backend[dev]'
          cd backend
          pytest
          ruff check companion tests

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend
        shell: bash
        run: |
          cd frontend
          npm ci
          npm run check
          npm test

      - name: Commit validated implementation
        shell: bash
        run: |
          rm -f .github/workflows/apply-duplicate-sorts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend frontend .github/workflows/apply-duplicate-sorts.yml
          git commit -m 'feat: add SQL-backed duplicate sorting'
          git push origin HEAD:feat/v2-shell
