name: Retry duplicate workspace fast path

on:
  push:
    branches: [feat/v2-shell]
    paths: [.github/workflows/retry-duplicate-workspace-fastpath.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-shell
      - name: Apply corrected fast path
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/apply-duplicate-workspace-fastpath.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          script = dedent('\n'.join(workflow[start:end]))
          provider_start = script.index('          # Persisted provider:') if '          # Persisted provider:' in script else script.index('# Persisted provider:')
          review_start = script.index('          # Review persistence:') if '          # Review persistence:' in script else script.index('# Review persistence:')
          provider_patch = r'''# Persisted provider: expose identity-only and explicit-group paths without asset-universe hydration.
path = Path('backend/companion/discovery/persisted_composite.py')
text = path.read_text()
text = replace_once(
    text,
    ''' + "'''" + '''from companion.composite_duplicate_repository import (
    CompositeDuplicateSnapshotGroup,
    CompositeDuplicateSnapshotPage,
)
''' + "'''" + ''',
    ''' + "'''" + '''from companion.composite_duplicate_repository import (
    CompositeDuplicateGroupIdentity,
    CompositeDuplicateSnapshotGroup,
    CompositeDuplicateSnapshotPage,
)
''' + "'''" + ''',
    'provider identity import',
)
text = replace_once(
    text,
    '    async def groups(self) -> list[CompositeDuplicateSnapshotGroup]: ...\n\n',
    '    async def groups(self) -> list[CompositeDuplicateSnapshotGroup]: ...\n\n'
    '    async def groups_by_ids(\n'
    '        self, group_ids: list[str]\n'
    '    ) -> list[CompositeDuplicateSnapshotGroup]: ...\n\n'
    '    async def identities(\n'
    '        self,\n'
    '        *,\n'
    '        group_ids: list[str] | None = None,\n'
    '        stable_group_keys: list[str] | None = None,\n'
    '    ) -> list[CompositeDuplicateGroupIdentity]: ...\n\n',
    'provider protocol',
)
insertion = ''' + "'''" + '''    async def resolve_identities(
        self,
        *,
        group_ids: list[str] | None = None,
        stable_group_keys: list[str] | None = None,
    ) -> list[CompositeDuplicateGroupIdentity]:
        return await self._snapshots.identities(
            group_ids=group_ids, stable_group_keys=stable_group_keys
        )

    async def discover_groups(self, group_ids: list[str]) -> list[DiscoveredGroup]:
        return await self._hydrate(await self._snapshots.groups_by_ids(group_ids))

''' + "'''" + '''
text = replace_once(
    text,
    '    async def discover(self) -> list[DiscoveredGroup]:\n',
    insertion + '    async def discover(self) -> list[DiscoveredGroup]:\n',
    'provider fast methods',
)
path.write_text(text)

'''
          script = script[:provider_start] + provider_patch + script[review_start:]
          exec(compile(script, '<workspace-fastpath>', 'exec'))
          PY
      - name: Remove patch workflows
        run: rm .github/workflows/apply-duplicate-workspace-fastpath.yml .github/workflows/retry-duplicate-workspace-fastpath.yml
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "perf: bound duplicate workspace restoration"
          git push origin HEAD:feat/v2-shell
