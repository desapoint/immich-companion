name: Remove redundant duplicate composite follow-up

on:
  push:
    branches:
      - feat/v2-shell
    paths:
      - tools/remove_duplicate_composite_followup.py
      - .github/workflows/remove-duplicate-composite-followup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-shell
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove redundant follow-up
        run: python tools/remove_duplicate_composite_followup.py
      - name: Format main
        run: |
          python -m pip install 'ruff<1,>=0.8'
          ruff check --fix backend/companion/main.py
      - name: Remove one-shot patch machinery
        run: git rm tools/remove_duplicate_composite_followup.py .github/workflows/remove-duplicate-composite-followup.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/companion/main.py
          git commit -m 'fix: avoid duplicate composite rebuild after resolution'
          git push origin HEAD:feat/v2-shell
