name: Backend localized validation

on:
  pull_request:
    branches:
      - feat/v2-shell

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: pip install -e '.[dev]'
      - name: Test backend
        run: pytest
      - name: Lint backend
        run: ruff check companion tests
