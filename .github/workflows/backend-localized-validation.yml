name: Localized change validation

on:
  pull_request:
    branches:
      - feat/v2-shell

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: pip install -e '.[dev]'
      - name: Test localized similarity path
        run: >-
          pytest
          tests/test_similarity_detail.py
          tests/test_similarity_detail_api.py
          tests/test_similarity_detail_main_registration.py
          tests/test_similarity_scan_service.py
      - name: Lint localized similarity path
        run: >-
          ruff check
          companion/similarity_detail.py
          companion/similarity_detail_api.py
          companion/similarity_detail_schema.py
          companion/similarity_detail_service.py
          companion/similarity_repository.py
          tests/test_similarity_detail.py
          tests/test_similarity_detail_api.py
          tests/test_similarity_detail_main_registration.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Test local diagnostics client
        run: npm test -- src/v2/data/localChangeDiagnostics.test.ts
      - name: Check touched localized-change frontend
        shell: bash
        run: |
          cat > tsconfig.localized.json <<'EOF'
          {
            "extends": "./tsconfig.app.json",
            "include": [
              "src/v2/data/localChangeDiagnostics.ts",
              "src/v2/data/localChangeDiagnostics.test.ts",
              "src/v2/components/V2CompareLocalChanges.svelte",
              "src/v2/components/V2ImageComparison.svelte",
              "src/v2/components/V2DuplicateCompareViewer.svelte"
            ]
          }
          EOF
          npx svelte-check --tsconfig ./tsconfig.localized.json
