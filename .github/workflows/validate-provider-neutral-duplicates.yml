name: Validate provider-neutral duplicate resolution

on:
  push:
    branches:
      - work/v2-provider-neutral-duplicate-resolution
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/v2-provider-neutral-duplicate-resolution
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Apply provider-neutral duplicate patch
        run: python .github/provider_neutral_duplicate_patch.py

      - name: Install backend
        run: python -m pip install -e './backend[dev]'

      - name: Backend tests
        working-directory: backend
        run: pytest

      - name: Backend lint
        working-directory: backend
        run: ruff check companion tests

      - name: Commit validated product tree
        if: success()
        run: |
          rm -f .github/workflows/validate-provider-neutral-duplicates.yml
          rm -f .github/provider_neutral_duplicate_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/companion backend/tests .github
          git commit -m 'fix: make duplicate resolution provider-neutral'
          git push origin HEAD:work/v2-provider-neutral-duplicate-resolution
