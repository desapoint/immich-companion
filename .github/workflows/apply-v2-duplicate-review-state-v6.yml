name: Apply V2 duplicate review state v6

on:
  push:
    branches:
      - work/v2-duplicate-review-state
    paths:
      - .github/workflows/apply-v2-duplicate-review-state-v6.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/v2-duplicate-review-state

      - name: Apply corrected V2 review-state slice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path('.github/workflows/apply-v2-duplicate-review-state-v5.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          lines = text[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(script, '<v2-review-state-v5-patch>', 'exec'), {})

          presentation = Path('frontend/src/v2/data/duplicatePresentation.test.ts')
          value = presentation.read_text()
          anchor = "    state: 'Needs review',\n    kind,"
          if anchor not in value:
              raise SystemExit('Missing duplicate presentation fixture anchor')
          presentation.write_text(value.replace(anchor, "    state: 'Needs review',\n    autoReady: false,\n    kind,", 1))

          demo = Path('frontend/src/v2/data/demo/demoLibraryDataSource.svelte.ts')
          value = demo.read_text()
          anchor = "discoverySources:group.kind.startsWith('Exact')?['immich_duplicate']:group.kind==='Mixed group'?['immich_duplicate','companion_similarity']:['companion_similarity'],state:group.state,kind:group.kind"
          replacement = "discoverySources:group.kind.startsWith('Exact')?['immich_duplicate']:group.kind==='Mixed group'?['immich_duplicate','companion_similarity']:['companion_similarity'],state:group.state,autoReady:group.kind.startsWith('Exact')&&group.state==='Actionable',kind:group.kind"
          if anchor not in value:
              raise SystemExit('Missing demo materialization anchor')
          value = value.replace(anchor, replacement, 1)
          old_filter = "query.state==='Auto-ready'?group.state==='Actionable':group.state===query.state"
          new_filter = "query.state==='Auto-ready'?group.autoReady&&group.state==='Actionable':group.state===query.state"
          if old_filter not in value:
              raise SystemExit('Missing demo auto-ready filter anchor')
          demo.write_text(value.replace(old_filter, new_filter, 1))
          PY

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Validate backend
        shell: bash
        run: |
          python -m pip install -e './backend[dev]'
          cd backend
          ruff format companion/composite_duplicate_repository.py companion/discovery/persisted_composite.py companion/duplicate_service.py companion/main.py companion/v2_duplicate_review_state.py companion/migrations/versions/20260914_0047_v2_duplicate_review_state.py tests/test_composite_duplicate_sync.py tests/test_v2_duplicate_review_state.py
          ruff check --fix companion/composite_duplicate_repository.py companion/discovery/persisted_composite.py companion/duplicate_service.py companion/main.py companion/v2_duplicate_review_state.py companion/migrations/versions/20260914_0047_v2_duplicate_review_state.py tests/test_composite_duplicate_sync.py tests/test_v2_duplicate_review_state.py
          pytest
          ruff check companion tests

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend
        shell: bash
        run: |
          cd frontend
          npm ci
          npm run check
          npm test

      - name: Commit validated implementation
        shell: bash
        run: |
          rm -f .github/workflows/apply-v2-duplicate-review-state.yml .github/workflows/apply-v2-duplicate-review-state-v3.yml .github/workflows/apply-v2-duplicate-review-state-v4.yml .github/workflows/apply-v2-duplicate-review-state-v5.yml .github/workflows/apply-v2-duplicate-review-state-v6.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend frontend .github/workflows/apply-v2-duplicate-review-state.yml .github/workflows/apply-v2-duplicate-review-state-v3.yml .github/workflows/apply-v2-duplicate-review-state-v4.yml .github/workflows/apply-v2-duplicate-review-state-v5.yml .github/workflows/apply-v2-duplicate-review-state-v6.yml
          git commit -m 'perf: make V2 duplicate review filters SQL-native'
          git push origin HEAD:work/v2-duplicate-review-state
