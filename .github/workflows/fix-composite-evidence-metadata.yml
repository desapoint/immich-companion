name: Fix composite evidence metadata

on:
  push:
    branches:
      - feat/v2-shell
    paths:
      - tools/fix_composite_evidence_metadata.py
      - .github/workflows/fix-composite-evidence-metadata.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-shell
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply evidence metadata fix
        run: python tools/fix_composite_evidence_metadata.py
      - name: Format changed backend files
        run: |
          python -m pip install 'ruff<1,>=0.8'
          ruff check --fix backend/companion/composite_duplicate_repository.py backend/companion/migrations/versions/20260914_0044_composite_duplicate_snapshot.py
      - name: Remove one-shot patch machinery
        run: git rm tools/fix_composite_evidence_metadata.py .github/workflows/fix-composite-evidence-metadata.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/companion/composite_duplicate_repository.py backend/companion/migrations/versions/20260914_0044_composite_duplicate_snapshot.py
          git commit -m 'fix: avoid reserved composite evidence metadata attribute'
          git push origin HEAD:feat/v2-shell
