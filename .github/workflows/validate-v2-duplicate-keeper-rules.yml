name: Validate V2 duplicate keeper rules

on:
  push:
    branches:
      - work/v2-duplicate-keeper-rules
    paths:
      - .github/workflows/validate-v2-duplicate-keeper-rules.yml
      - .keeper-patch/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/v2-duplicate-keeper-rules

      - name: Inspect staged keeper patch prefix
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          payload = ''.join(path.read_text().strip() for path in sorted(Path('.keeper-patch').glob('p*')))
          complete_length = len(payload) - (len(payload) % 4)
          decoded = base64.b64decode(payload[:complete_length])
          print(f'Encoded chars: {len(payload)}; decoded complete prefix: {len(decoded)} bytes')
          try:
              compile(decoded, '<keeper-rules-patch>', 'exec')
          except SyntaxError as error:
              print(f'PATCH_INCOMPLETE: {error}')
          print('--- decoded patch tail ---')
          print(decoded[-5000:].decode('utf-8', errors='replace'))
          PY
