name: Apply duplicate standard pagination slice

on:
  push:
    branches:
      - feat/v2-shell
    paths:
      - .github/workflows/apply-duplicate-standard-pagination.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-shell
          fetch-depth: 0
      - name: Apply pagination slice
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:120]!r}")
              target.write_text(text.replace(old, new, 1))

          # Persisted composite repository: add SQL paging and source filtering.
          path = "backend/companion/composite_duplicate_repository.py"
          replace(path, "    delete,\n    select,\n)", "    delete,\n    exists,\n    func,\n    select,\n)")
          replace(path, '''@dataclass(frozen=True, slots=True)\nclass CompositeDuplicateSnapshotGroup:\n    group_id: str\n    discovery_source: DiscoverySource\n    provider_group_id: str | None\n    asset_ids: tuple[UUID, ...]\n    provider_metadata: dict[str, str]\n    evidence: tuple[DiscoveryEvidence, ...]\n    similarity_validation: ValidatedSimilarityGroup | None\n\n\n''', '''@dataclass(frozen=True, slots=True)\nclass CompositeDuplicateSnapshotGroup:\n    group_id: str\n    discovery_source: DiscoverySource\n    provider_group_id: str | None\n    asset_ids: tuple[UUID, ...]\n    provider_metadata: dict[str, str]\n    evidence: tuple[DiscoveryEvidence, ...]\n    similarity_validation: ValidatedSimilarityGroup | None\n\n\n@dataclass(frozen=True, slots=True)\nclass CompositeDuplicateSnapshotPage:\n    groups: list[CompositeDuplicateSnapshotGroup]\n    total: int\n    page: int\n    page_size: int\n    pages: int\n\n\n''')
          marker = '''    async def replace_snapshot(\n        self,\n        groups: list[DiscoveredGroup],\n    ) -> CompositeDuplicateSnapshotMetadata:\n'''
          page_method = '''    async def page(\n        self,\n        *,\n        page: int,\n        page_size: int,\n        source: DiscoverySource | None = None,\n    ) -> CompositeDuplicateSnapshotPage:\n        \"\"\"Read one ordered page without hydrating the full duplicate universe.\"\"\"\n\n        page = max(1, page)\n        page_size = max(1, min(page_size, 100))\n        offset = (page - 1) * page_size\n        source_filter = (\n            exists(\n                select(1).where(\n                    CompositeDuplicateGroupEvidenceRecord.group_id\n                    == CompositeDuplicateGroupRecord.group_id,\n                    CompositeDuplicateGroupEvidenceRecord.discovery_source == source.value,\n                )\n            )\n            if source is not None\n            else None\n        )\n\n        async with self._database.sessions() as session:\n            count_statement = select(func.count()).select_from(CompositeDuplicateGroupRecord)\n            group_statement = (\n                select(CompositeDuplicateGroupRecord)\n                .order_by(CompositeDuplicateGroupRecord.position)\n                .offset(offset)\n                .limit(page_size)\n            )\n            if source_filter is not None:\n                count_statement = count_statement.where(source_filter)\n                group_statement = group_statement.where(source_filter)\n\n            total = int((await session.scalar(count_statement)) or 0)\n            group_rows = list((await session.execute(group_statement)).scalars())\n            group_ids = [row.group_id for row in group_rows]\n            if group_ids:\n                member_rows = list(\n                    (\n                        await session.execute(\n                            select(\n                                CompositeDuplicateGroupMemberRecord.group_id,\n                                CompositeDuplicateGroupMemberRecord.asset_id,\n                            )\n                            .where(\n                                CompositeDuplicateGroupMemberRecord.group_id.in_(group_ids)\n                            )\n                            .order_by(\n                                CompositeDuplicateGroupMemberRecord.group_id,\n                                CompositeDuplicateGroupMemberRecord.position,\n                            )\n                        )\n                    ).all()\n                )\n                evidence_rows = list(\n                    (\n                        await session.execute(\n                            select(CompositeDuplicateGroupEvidenceRecord)\n                            .where(\n                                CompositeDuplicateGroupEvidenceRecord.group_id.in_(group_ids)\n                            )\n                            .order_by(\n                                CompositeDuplicateGroupEvidenceRecord.group_id,\n                                CompositeDuplicateGroupEvidenceRecord.discovery_source,\n                            )\n                        )\n                    ).scalars()\n                )\n            else:\n                member_rows = []\n                evidence_rows = []\n\n        members: dict[str, list[UUID]] = {}\n        for group_id, asset_id in member_rows:\n            members.setdefault(group_id, []).append(asset_id)\n        evidence: dict[str, list[DiscoveryEvidence]] = {}\n        for row in evidence_rows:\n            evidence.setdefault(row.group_id, []).append(\n                DiscoveryEvidence(\n                    discovery_source=DiscoverySource(row.discovery_source),\n                    provider_group_id=row.provider_group_id,\n                    metadata=dict(row.evidence_metadata or {}),\n                )\n            )\n        groups = [\n            CompositeDuplicateSnapshotGroup(\n                group_id=row.group_id,\n                discovery_source=DiscoverySource(row.discovery_source),\n                provider_group_id=row.provider_group_id,\n                asset_ids=tuple(members.get(row.group_id, [])),\n                provider_metadata=dict(row.provider_metadata or {}),\n                evidence=tuple(evidence.get(row.group_id, [])),\n                similarity_validation=_validation_from_payload(row.similarity_validation),\n            )\n            for row in group_rows\n            if len(members.get(row.group_id, [])) >= 2\n        ]\n        return CompositeDuplicateSnapshotPage(\n            groups=groups,\n            total=total,\n            page=page,\n            page_size=page_size,\n            pages=(total + page_size - 1) // page_size,\n        )\n\n'''
          replace(path, marker, page_method + marker)

          # Persisted provider: hydrate only the requested page.
          Path("backend/companion/discovery/persisted_composite.py").write_text('''\"\"\"Database-backed provider for the published composite duplicate projection.\"\"\"\n\nfrom __future__ import annotations\n\nimport logging\nfrom dataclasses import dataclass\nfrom typing import Protocol\nfrom uuid import UUID\n\nfrom companion.composite_duplicate_repository import (\n    CompositeDuplicateSnapshotGroup,\n    CompositeDuplicateSnapshotPage,\n)\nfrom companion.discovery.base import DiscoveredGroup\nfrom companion.group_decision import DiscoverySource\nfrom companion.immich import ImmichAsset\n\nlogger = logging.getLogger(\"uvicorn.error\")\n\n\nclass _CompositeSnapshotReader(Protocol):\n    async def groups(self) -> list[CompositeDuplicateSnapshotGroup]: ...\n\n    async def page(\n        self,\n        *,\n        page: int,\n        page_size: int,\n        source: DiscoverySource | None = None,\n    ) -> CompositeDuplicateSnapshotPage: ...\n\n\nclass _AssetReader(Protocol):\n    async def get_immich_assets(self, asset_ids: list[UUID]) -> dict[UUID, ImmichAsset]: ...\n\n\n@dataclass(frozen=True, slots=True)\nclass DiscoveredGroupPage:\n    groups: list[DiscoveredGroup]\n    total: int\n    page: int\n    page_size: int\n    pages: int\n\n\nclass PersistedCompositeDuplicateProvider:\n    \"\"\"Hydrate the last published provider-neutral duplicate snapshot from local data.\"\"\"\n\n    def __init__(self, snapshots: _CompositeSnapshotReader, assets: _AssetReader) -> None:\n        self._snapshots = snapshots\n        self._assets = assets\n\n    async def _hydrate(\n        self, snapshot: list[CompositeDuplicateSnapshotGroup]\n    ) -> list[DiscoveredGroup]:\n        asset_ids = list(\n            dict.fromkeys(asset_id for group in snapshot for asset_id in group.asset_ids)\n        )\n        assets = await self._assets.get_immich_assets(asset_ids)\n        discovered: list[DiscoveredGroup] = []\n        for group in snapshot:\n            group_assets = tuple(\n                assets[asset_id] for asset_id in group.asset_ids if asset_id in assets\n            )\n            if len(group_assets) != len(group.asset_ids):\n                logger.warning(\n                    \"Skipping persisted composite duplicate group %s because %s/%s local \"\n                    \"members are available\",\n                    group.group_id,\n                    len(group_assets),\n                    len(group.asset_ids),\n                )\n                continue\n            discovered.append(\n                DiscoveredGroup(\n                    group_id=group.group_id,\n                    discovery_source=group.discovery_source,\n                    provider_group_id=group.provider_group_id,\n                    assets=group_assets,\n                    provider_metadata=group.provider_metadata,\n                    discovery_evidence=group.evidence,\n                    similarity_validation=group.similarity_validation,\n                )\n            )\n        return discovered\n\n    async def discover(self) -> list[DiscoveredGroup]:\n        return await self._hydrate(await self._snapshots.groups())\n\n    async def discover_page(\n        self,\n        *,\n        page: int,\n        page_size: int,\n        source: str = \"both\",\n    ) -> DiscoveredGroupPage:\n        source_value = (\n            DiscoverySource.IMMICH_DUPLICATE\n            if source == \"immich\"\n            else DiscoverySource.COMPANION_SIMILARITY\n            if source == \"similarity\"\n            else None\n        )\n        snapshot = await self._snapshots.page(\n            page=page,\n            page_size=page_size,\n            source=source_value,\n        )\n        return DiscoveredGroupPage(\n            groups=await self._hydrate(snapshot.groups),\n            total=snapshot.total,\n            page=snapshot.page,\n            page_size=snapshot.page_size,\n            pages=snapshot.pages,\n        )\n''')

          # Standard page response contract.
          path = "backend/companion/duplicate_schema.py"
          replace(path, '''class CrossSourceDuplicateTaskStart(BaseModel):\n    task_id: UUID\n\n\n''', '''class DuplicateSearchPage(BaseModel):\n    items: list[ExactDuplicateGroup]\n    total: int = Field(ge=0)\n    page: int = Field(ge=1)\n    page_size: int = Field(ge=1, le=100)\n    pages: int = Field(ge=0)\n\n\nclass CrossSourceDuplicateTaskStart(BaseModel):\n    task_id: UUID\n\n\n''')

          # Page-scoped service assembly; legacy full review remains for derived filters/actions.
          path = "backend/companion/duplicate_service.py"
          replace(path, "from typing import Any\n", "from typing import Any, Literal\n")
          replace(path, '''    DuplicateResolutionPlanRequest,\n    DuplicateReviewUpdate,\n''', '''    DuplicateResolutionPlanRequest,\n    DuplicateReviewUpdate,\n    DuplicateSearchPage,\n''')
          review_end = '''        return result.model_copy(\n            update={\n                \"analysis_task_id\": task_id,\n                \"analysis_pending_count\": pending_count,\n                \"analysis_candidate_count\": len(candidates),\n                \"analysis_cached_count\": len(candidates) - pending_count,\n            }\n        )\n\n'''
          page_service = '''        return result.model_copy(\n            update={\n                \"analysis_task_id\": task_id,\n                \"analysis_pending_count\": pending_count,\n                \"analysis_candidate_count\": len(candidates),\n                \"analysis_cached_count\": len(candidates) - pending_count,\n            }\n        )\n\n    async def review_page(\n        self,\n        options: DuplicateAnalysisOptions | None = None,\n        *,\n        page: int = 1,\n        page_size: int = 6,\n        source: Literal[\"both\", \"immich\", \"similarity\"] = \"both\",\n    ) -> DuplicateSearchPage:\n        \"\"\"Return one database-backed page and hydrate only its members/evidence.\"\"\"\n\n        options = await self._options(options)\n        page = max(1, page)\n        page_size = max(1, min(page_size, 100))\n        discover_page = getattr(self._discovery, \"discover_page\", None)\n        if callable(discover_page):\n            discovered = await discover_page(\n                page=page,\n                page_size=page_size,\n                source=source,\n            )\n            groups = discovered.groups\n            total = discovered.total\n            resolved_page = discovered.page\n            resolved_page_size = discovered.page_size\n            pages = discovered.pages\n        else:\n            all_groups = await self._live_groups()\n            if source != \"both\":\n                expected = (\n                    DiscoverySource.IMMICH_DUPLICATE\n                    if source == \"immich\"\n                    else DiscoverySource.COMPANION_SIMILARITY\n                )\n                all_groups = [\n                    group\n                    for group in all_groups\n                    if expected in {item.discovery_source for item in group.evidence}\n                ]\n            total = len(all_groups)\n            resolved_page = page\n            resolved_page_size = page_size\n            pages = (total + page_size - 1) // page_size\n            start = (page - 1) * page_size\n            groups = all_groups[start : start + page_size]\n\n        _, _, _, result = await self._snapshot_groups(groups, options)\n        return DuplicateSearchPage(\n            items=result.groups,\n            total=total,\n            page=resolved_page,\n            page_size=resolved_page_size,\n            pages=pages,\n        )\n\n'''
          replace(path, review_end, page_service)
          old_snapshot = '''    async def _snapshot(\n        self,\n        options: DuplicateAnalysisOptions,\n    ) -> tuple[\n        list[DiscoveredGroup],\n        dict[UUID, AssetIntegrityReportRecord],\n        dict[UUID, AssetSimilarityFeatureRecord],\n        CrossSourceDuplicateResult,\n    ]:\n        groups = await self._live_groups()\n        report_ids = [\n'''
          new_snapshot = '''    async def _snapshot(\n        self,\n        options: DuplicateAnalysisOptions,\n    ) -> tuple[\n        list[DiscoveredGroup],\n        dict[UUID, AssetIntegrityReportRecord],\n        dict[UUID, AssetSimilarityFeatureRecord],\n        CrossSourceDuplicateResult,\n    ]:\n        return await self._snapshot_groups(await self._live_groups(), options)\n\n    async def _snapshot_groups(\n        self,\n        groups: list[DiscoveredGroup],\n        options: DuplicateAnalysisOptions,\n    ) -> tuple[\n        list[DiscoveredGroup],\n        dict[UUID, AssetIntegrityReportRecord],\n        dict[UUID, AssetSimilarityFeatureRecord],\n        CrossSourceDuplicateResult,\n    ]:\n        report_ids = [\n'''
          replace(path, old_snapshot, new_snapshot)

          # FastAPI page endpoint next to the legacy full-search endpoint.
          path = "backend/companion/main.py"
          replace(path, '''    DuplicateReviewUpdate,\n    DuplicateSimilarityReferenceRequest,\n''', '''    DuplicateReviewUpdate,\n    DuplicateSearchPage,\n    DuplicateSimilarityReferenceRequest,\n''')
          route_marker = '''    @app.post(\n        \"/api/assets/duplicates/cross-source/analyze\",\n        response_model=CrossSourceDuplicateTaskStart,\n'''
          page_route = '''    @app.post(\n        \"/api/assets/duplicates/cross-source/page\",\n        response_model=DuplicateSearchPage,\n    )\n    async def page_cross_source_duplicates(\n        request: DuplicateAnalysisOptions,\n        page: int = Query(default=1, ge=1),\n        page_size: int = Query(default=6, ge=1, le=100),\n        source: Literal[\"both\", \"immich\", \"similarity\"] = Query(default=\"both\"),\n    ) -> DuplicateSearchPage:\n        try:\n            return await require_duplicate_service().review_page(\n                request,\n                page=page,\n                page_size=page_size,\n                source=source,\n            )\n        except ImmichApiError as error:\n            raise map_immich_error(error) from error\n\n'''
          replace(path, route_marker, page_route + route_marker)

          # Frontend: use standard backend page/total/page_size/pages for All groups.
          path = "frontend/src/v2/data/api/duplicateRepository.ts"
          replace(path, "type ApiDuplicateResult = { group_count: number; groups: ApiDuplicateGroup[] };\n", "type ApiDuplicateResult = { group_count: number; groups: ApiDuplicateGroup[] };\ntype ApiDuplicatePage = { items: ApiDuplicateGroup[]; total: number; page: number; page_size: number; pages: number };\n")
          replace(path, '''function pageNumber(query: DuplicateSearchQuery): number {\n  if (query.page) return query.page;\n  const cursor = Number.parseInt(query.cursor ?? '', 10);\n  return Number.isSafeInteger(cursor) && cursor > 0 ? cursor : 1;\n}\n\n''', '''function pageNumber(query: DuplicateSearchQuery): number {\n  if (query.page) return query.page;\n  const cursor = Number.parseInt(query.cursor ?? '', 10);\n  return Number.isSafeInteger(cursor) && cursor > 0 ? cursor : 1;\n}\n\nfunction normalizeDuplicatePage(\n  value: ApiDuplicatePage | ApiDuplicateResult,\n  query: DuplicateSearchQuery,\n  page: number,\n): ApiDuplicatePage {\n  if ('items' in value) return value;\n  const filtered = value.groups.filter((group) => {\n    const sources = group.discovery_sources?.length ? group.discovery_sources : [group.discovery_source];\n    return matchesDuplicateSource(sources, query.source ?? 'both');\n  });\n  const start = (page - 1) * query.pageSize;\n  return {\n    items: filtered.slice(start, start + query.pageSize),\n    total: filtered.length,\n    page,\n    page_size: query.pageSize,\n    pages: Math.ceil(filtered.length / query.pageSize),\n  };\n}\n\n''')
          replace(path, '''  let rawGroups = new Map<string, ApiDuplicateGroup>();\n  let hasSearchSnapshot = false;\n  let visibleGroupIds = new Set<string>();\n''', '''  let rawGroups = new Map<string, ApiDuplicateGroup>();\n  let hasSearchSnapshot = false;\n  let hasWorkspaceSnapshot = false;\n  let visibleGroupIds = new Set<string>();\n''')
          old_search = '''    async search(query): Promise<PageResult<DuplicateGroupRecord>> {\n      if (!query.reuseCachedGroups || !hasSearchSnapshot) {\n        const [result, restored] = await Promise.all([\n          requestJson<ApiDuplicateResult>('/api/assets/duplicates/cross-source/search', { ...jsonRequest('POST', ANALYSIS_OPTIONS), signal: query.signal }),\n          requestJson<ApiDuplicateWorkspace>('/api/assets/duplicates/workspace', { signal: query.signal }),\n        ]);\n        workspace = restored;\n        rawGroups = new Map(result.groups.map((group) => [group.group_id, group]));\n        hasSearchSnapshot = true;\n      }\n      const filtered = [...rawGroups.values()].filter((group) => {\n        const state = groupState(group, draftFor(group.group_id));\n        const sources = group.discovery_sources?.length ? group.discovery_sources : [group.discovery_source];\n        return matchesDuplicateSource(sources, query.source ?? 'both')\n          && (!query.state || query.state === 'All groups' || (query.state === 'Auto-ready' ? state === 'Actionable' : state === query.state));\n      });\n      const page = pageNumber(query);\n      const start = (page - 1) * query.pageSize;\n      const items = filtered.slice(start, start + query.pageSize).map(materialize);\n      visibleGroupIds = new Set(items.map((group) => group.id));\n      return { items, total: filtered.length, pageSize: query.pageSize, page, nextCursor: start + query.pageSize < filtered.length ? String(page + 1) : null };\n    },\n'''
          new_search = '''    async search(query): Promise<PageResult<DuplicateGroupRecord>> {\n      const page = pageNumber(query);\n      if (!query.state || query.state === 'All groups') {\n        const params = new URLSearchParams({\n          page: String(page),\n          page_size: String(query.pageSize),\n          source: query.source ?? 'both',\n        });\n        const restoreWorkspace = !hasWorkspaceSnapshot || !query.reuseCachedGroups;\n        const [rawPage, restored] = await Promise.all([\n          requestJson<ApiDuplicatePage | ApiDuplicateResult>(`/api/assets/duplicates/cross-source/page?${params.toString()}`, { ...jsonRequest('POST', ANALYSIS_OPTIONS), signal: query.signal }),\n          restoreWorkspace\n            ? requestJson<ApiDuplicateWorkspace>('/api/assets/duplicates/workspace', { signal: query.signal })\n            : Promise.resolve(null),\n        ]);\n        if (restored) {\n          workspace = restored;\n          hasWorkspaceSnapshot = true;\n        }\n        if (!query.reuseCachedGroups) {\n          rawGroups.clear();\n          hasSearchSnapshot = false;\n        }\n        const result = normalizeDuplicatePage(rawPage, query, page);\n        for (const group of result.items) rawGroups.set(group.group_id, group);\n        const items = result.items.map(materialize);\n        visibleGroupIds = new Set(items.map((group) => group.id));\n        return {\n          items,\n          total: result.total,\n          pageSize: result.page_size,\n          page: result.page,\n          nextCursor: result.page < result.pages ? String(result.page + 1) : null,\n        };\n      }\n\n      if (!query.reuseCachedGroups || !hasSearchSnapshot) {\n        const restoreWorkspace = !hasWorkspaceSnapshot || !query.reuseCachedGroups;\n        const [result, restored] = await Promise.all([\n          requestJson<ApiDuplicateResult>('/api/assets/duplicates/cross-source/search', { ...jsonRequest('POST', ANALYSIS_OPTIONS), signal: query.signal }),\n          restoreWorkspace\n            ? requestJson<ApiDuplicateWorkspace>('/api/assets/duplicates/workspace', { signal: query.signal })\n            : Promise.resolve(null),\n        ]);\n        if (restored) {\n          workspace = restored;\n          hasWorkspaceSnapshot = true;\n        }\n        rawGroups = new Map(result.groups.map((group) => [group.group_id, group]));\n        hasSearchSnapshot = true;\n      }\n      const filtered = [...rawGroups.values()].filter((group) => {\n        const state = groupState(group, draftFor(group.group_id));\n        const sources = group.discovery_sources?.length ? group.discovery_sources : [group.discovery_source];\n        return matchesDuplicateSource(sources, query.source ?? 'both')\n          && (query.state === 'Auto-ready' ? state === 'Actionable' : state === query.state);\n      });\n      const start = (page - 1) * query.pageSize;\n      const items = filtered.slice(start, start + query.pageSize).map(materialize);\n      visibleGroupIds = new Set(items.map((group) => group.id));\n      return { items, total: filtered.length, pageSize: query.pageSize, page, nextCursor: start + query.pageSize < filtered.length ? String(page + 1) : null };\n    },\n'''
          replace(path, old_search, new_search)

          # Backend provider paging test.
          path = "backend/tests/test_composite_duplicate_sync.py"
          replace(path, '''from companion.composite_duplicate_repository import (\n    CompositeDuplicateSnapshotGroup,\n    CompositeDuplicateSnapshotMetadata,\n)\n''', '''from companion.composite_duplicate_repository import (\n    CompositeDuplicateSnapshotGroup,\n    CompositeDuplicateSnapshotMetadata,\n    CompositeDuplicateSnapshotPage,\n)\n''')
          test_marker = '''@pytest.mark.asyncio\nasync def test_rebuild_handler_materializes_source_discovery_once() -> None:\n'''
          page_test = '''@pytest.mark.asyncio\nasync def test_persisted_provider_pages_before_asset_hydration() -> None:\n    second_group = CompositeDuplicateSnapshotGroup(\n        group_id=\"companion:similarity:2\",\n        discovery_source=DiscoverySource.COMPANION_SIMILARITY,\n        provider_group_id=\"scan-2\",\n        asset_ids=(ASSET_1, ASSET_2),\n        provider_metadata={},\n        evidence=(\n            DiscoveryEvidence(\n                discovery_source=DiscoverySource.COMPANION_SIMILARITY,\n                provider_group_id=\"scan-2\",\n            ),\n        ),\n        similarity_validation=validation(),\n    )\n\n    class Snapshots:\n        received = None\n\n        async def page(self, **kwargs):\n            self.received = kwargs\n            return CompositeDuplicateSnapshotPage(\n                groups=[second_group],\n                total=23,\n                page=3,\n                page_size=1,\n                pages=23,\n            )\n\n    class Assets:\n        requested = None\n\n        async def get_immich_assets(self, asset_ids):\n            self.requested = asset_ids\n            return {asset_id: asset(asset_id) for asset_id in asset_ids}\n\n    snapshots = Snapshots()\n    assets = Assets()\n    result = await PersistedCompositeDuplicateProvider(snapshots, assets).discover_page(\n        page=3,\n        page_size=1,\n        source=\"similarity\",\n    )\n\n    assert snapshots.received == {\n        \"page\": 3,\n        \"page_size\": 1,\n        \"source\": DiscoverySource.COMPANION_SIMILARITY,\n    }\n    assert assets.requested == [ASSET_1, ASSET_2]\n    assert result.total == 23\n    assert result.pages == 23\n    assert [group.group_id for group in result.groups] == [second_group.group_id]\n\n\n'''
          replace(path, test_marker, page_test + test_marker)

          # Frontend test: page changes hit the server; workspace is restored once.
          path = "frontend/src/v2/data/api/duplicateRepository.test.ts"
          old_test = '''  it('reuses the fetched group snapshot for page changes and refreshes explicitly', async () => {\n    const secondGroup = { ...group, group_id: 'second-group' };\n    let currentGroups = [group, secondGroup];\n    const fetcher = vi.fn(async (input: RequestInfo | URL) =>\n      String(input).endsWith('/workspace')\n        ? response(emptyWorkspace)\n        : response({ ...duplicateResult, groups: currentGroups }));\n    vi.stubGlobal('fetch', fetcher);\n    const repository = createDuplicateRepository(tasks());\n\n    expect((await repository.search({ page: 1, pageSize: 1 })).total).toBe(2);\n    currentGroups = [group];\n    const cached = await repository.search({ page: 2, pageSize: 1, reuseCachedGroups: true });\n    expect(cached.items[0]?.id).toBe('second-group');\n    expect(fetcher).toHaveBeenCalledTimes(2);\n\n    vi.spyOn(Date, 'now').mockReturnValue(Date.now() + 10 * 60_000);\n    const laterPage = await repository.search({ page: 1, pageSize: 1, reuseCachedGroups: true });\n    expect(laterPage.items[0]?.id).toBe(group.group_id);\n    expect(fetcher).toHaveBeenCalledTimes(2);\n\n    const refreshed = await repository.search({ page: 1, pageSize: 1 });\n    expect(refreshed.total).toBe(1);\n    expect(fetcher).toHaveBeenCalledTimes(4);\n  });\n'''
          new_test = '''  it('uses server pagination for page changes and restores workspace once', async () => {\n    const secondGroup = { ...group, group_id: 'second-group' };\n    let currentGroups = [group, secondGroup];\n    const fetcher = vi.fn(async (input: RequestInfo | URL) => {\n      const path = String(input);\n      if (path.endsWith('/workspace')) return response(emptyWorkspace);\n      if (path.includes('/cross-source/page?')) {\n        const url = new URL(path, 'http://localhost');\n        const page = Number(url.searchParams.get('page') ?? '1');\n        const pageSize = Number(url.searchParams.get('page_size') ?? '1');\n        const start = (page - 1) * pageSize;\n        return response({\n          items: currentGroups.slice(start, start + pageSize),\n          total: currentGroups.length,\n          page,\n          page_size: pageSize,\n          pages: Math.ceil(currentGroups.length / pageSize),\n        });\n      }\n      throw new Error(`Unexpected request: ${path}`);\n    });\n    vi.stubGlobal('fetch', fetcher);\n    const repository = createDuplicateRepository(tasks());\n\n    expect((await repository.search({ page: 1, pageSize: 1 })).total).toBe(2);\n    currentGroups = [group];\n    const laterPage = await repository.search({ page: 2, pageSize: 1, reuseCachedGroups: true });\n    expect(laterPage.items).toEqual([]);\n    expect(fetcher).toHaveBeenCalledTimes(3);\n\n    const firstPage = await repository.search({ page: 1, pageSize: 1, reuseCachedGroups: true });\n    expect(firstPage.items[0]?.id).toBe(group.group_id);\n    expect(fetcher).toHaveBeenCalledTimes(4);\n\n    const refreshed = await repository.search({ page: 1, pageSize: 1 });\n    expect(refreshed.total).toBe(1);\n    expect(fetcher).toHaveBeenCalledTimes(6);\n  });\n'''
          replace(path, old_test, new_test)

          # Path-specific test stubs need to accept the new page endpoint too.
          text = Path(path).read_text()
          text = text.replace("if (path.endsWith('/cross-source/search')) return response(duplicateResult);", "if (path.includes('/cross-source/page?')) return response(duplicateResult);\n      if (path.endsWith('/cross-source/search')) return response(duplicateResult);")
          text = text.replace("if (path.endsWith('/cross-source/search')) return response(resultWithOverlap);", "if (path.includes('/cross-source/page?')) return response(resultWithOverlap);\n      if (path.endsWith('/cross-source/search')) return response(resultWithOverlap);")
          text = text.replace("if (path.endsWith('/cross-source/search')) return response({ ...duplicateResult, group_count: 2, groups: [group, secondGroup] });", "if (path.includes('/cross-source/page?')) return response({ ...duplicateResult, group_count: 2, groups: [group, secondGroup] });\n      if (path.endsWith('/cross-source/search')) return response({ ...duplicateResult, group_count: 2, groups: [group, secondGroup] });")
          Path(path).write_text(text)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-duplicate-standard-pagination.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend .github/workflows/apply-duplicate-standard-pagination.yml
          git commit -m "perf: page persisted duplicate review from database"
          git push origin HEAD:feat/v2-shell
