name: Normalize metadata keeper once

on:
  push:
    branches:
      - feat/v2-shell

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: feat/v2-shell

      - name: Normalize backend service and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          service_path = Path('backend/companion/duplicate_service.py')
          text = service_path.read_text()

          old_helper = '''def _metadata_keeper_for_plan(
              discovery_source: str,
              saved_keeper_id: UUID | None,
              keep_ids: list[UUID],
              trash_ids: list[UUID],
          ) -> UUID | None:
              """Choose metadata target without inventing one for multi-survivor similarity groups."""

              if not trash_ids:
                  return None
              if (
                  discovery_source == DiscoverySource.COMPANION_SIMILARITY.value
                  and len(keep_ids) > 1
              ):
                  return None
              if saved_keeper_id in keep_ids:
                  return saved_keeper_id
              return keep_ids[0] if len(keep_ids) == 1 else None
          '''
          new_helper = '''def _metadata_keeper_for_plan(
              keep_ids: list[UUID],
              trash_ids: list[UUID],
          ) -> UUID | None:
              """Return the sole surviving metadata target for a destructive resolution."""

              return keep_ids[0] if trash_ids and len(keep_ids) == 1 else None
          '''
          if old_helper not in text:
              raise SystemExit('metadata keeper plan helper pattern not found')
          text = text.replace(old_helper, new_helper, 1)

          old_call = '''            metadata_keeper_id = _metadata_keeper_for_plan(
                          group.discovery_source,
                          getattr(record, "metadata_keeper_asset_id", None) if record else None,
                          keep_ids,
                          trash_ids,
                      )
          '''
          new_call = '''            metadata_keeper_id = _metadata_keeper_for_plan(
                          keep_ids,
                          trash_ids,
                      )
          '''
          if old_call not in text:
              raise SystemExit('metadata keeper plan call pattern not found')
          text = text.replace(old_call, new_call, 1)

          old_save = '''        metadata_keeper_asset_id = request.metadata_keeper_asset_id
                  if has_deletions and len(survivor_ids) == 1:
                      metadata_keeper_asset_id = survivor_ids[0]
                  elif not has_deletions:
                      metadata_keeper_asset_id = None
                  if metadata_keeper_asset_id is not None:
                      keeper = decisions.get(metadata_keeper_asset_id)
                      if keeper is not None and keeper.disposition == "delete":
                          raise ActionPlanConflictError("The metadata keeper cannot be marked Delete")
                      if metadata_keeper_asset_id not in member_ids:
                          raise ActionPlanConflictError("The metadata keeper is not a group member")
          '''
          new_save = '''        metadata_keeper_asset_id = (
                      survivor_ids[0]
                      if request.status == "completed"
                      and len(decisions) == len(member_ids)
                      and has_deletions
                      and len(survivor_ids) == 1
                      else None
                  )
          '''
          if old_save not in text:
              raise SystemExit('save_group_draft metadata keeper pattern not found')
          text = text.replace(old_save, new_save, 1)
          service_path.write_text(text)

          policy_test = Path('backend/tests/test_duplicate_metadata_policy.py')
          tests = policy_test.read_text()
          replacements = {
              '''        _metadata_keeper_for_plan(
                      "companion_similarity",
                      A,
                      [A, B],
                      [C],
                  )''': '''        _metadata_keeper_for_plan(
                      [A, B],
                      [C],
                  )''',
              '''        _metadata_keeper_for_plan(
                      "companion_similarity",
                      None,
                      [A],
                      [B, C],
                  )''': '''        _metadata_keeper_for_plan(
                      [A],
                      [B, C],
                  )''',
              '''    assert _metadata_keeper_for_plan("companion_similarity", A, [A, B], []) is None''': '''    assert _metadata_keeper_for_plan([A, B], []) is None''',
              '''def test_existing_non_similarity_metadata_keeper_is_preserved() -> None:
              assert _metadata_keeper_for_plan("immich_duplicate", B, [A, B], [C]) == B
          ''': '''def test_multiple_survivors_never_create_metadata_target() -> None:
              assert _metadata_keeper_for_plan([A, B], [C]) is None
          ''',
          }
          for old, new in replacements.items():
              if old not in tests:
                  raise SystemExit(f'policy test pattern not found: {old!r}')
              tests = tests.replace(old, new, 1)
          policy_test.write_text(tests)

          frontend_test = Path('frontend/src/v2/data/api/duplicateRepository.test.ts')
          tests = frontend_test.read_text()
          old = '''    expect(calls.find((call) => call.path.endsWith('/workspace/group'))?.body).toMatchObject({
                group_id: group.group_id,
                member_fingerprint: group.member_fingerprint,
                status: 'completed',
              });'''
          new = '''    expect(calls.find((call) => call.path.endsWith('/workspace/group'))?.body).toMatchObject({
                group_id: group.group_id,
                member_fingerprint: group.member_fingerprint,
                metadata_keeper_asset_id: ASSET_IDS[0],
                status: 'completed',
              });'''
          if old not in tests:
              raise SystemExit('frontend draft payload assertion pattern not found')
          frontend_test.write_text(tests.replace(old, new, 1))
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install backend test dependencies
        run: python -m pip install -e 'backend[dev]'

      - name: Run focused backend tests
        run: python -m pytest backend/tests/test_duplicate_metadata_policy.py backend/tests/test_duplicate_review_repository_query.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run focused frontend tests
        working-directory: frontend
        run: npm test -- --run src/v2/state/duplicateAutomationRules.test.ts src/v2/data/api/duplicateRepository.test.ts

      - name: Commit normalized implementation
        shell: bash
        run: |
          rm .github/workflows/normalize-metadata-keeper-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/companion/duplicate_service.py \
                  backend/tests/test_duplicate_metadata_policy.py \
                  frontend/src/v2/data/api/duplicateRepository.test.ts \
                  .github/workflows/normalize-metadata-keeper-once.yml
          git commit -m 'Normalize duplicate metadata keeper semantics'
          git push origin HEAD:feat/v2-shell
