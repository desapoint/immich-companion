version: "3.8"

services:
  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:?Run scripts/test-env.sh to create local test configuration}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - immich-postgres:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname=$${POSTGRES_DB} --username=$${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.1.0
    volumes:
      - immich-model-cache:/cache
    healthcheck:
      test: ["CMD-SHELL", "python3 healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.1.0
    environment:
      DB_HOSTNAME: database
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: ${IMMICH_DB_PASSWORD:?Run scripts/test-env.sh to create local test configuration}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      REDIS_PORT: "6379"
      IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
    volumes:
      - immich-upload:/data
    ports:
      - "${IMMICH_TEST_BIND:-0.0.0.0}:${IMMICH_TEST_PORT:-22830}:2283"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "immich-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  companion-database:
    image: docker.io/library/postgres:16.15-alpine3.24
    environment:
      POSTGRES_PASSWORD: ${COMPANION_DB_PASSWORD:?Run scripts/test-env.sh to create local test configuration}
      POSTGRES_USER: companion
      POSTGRES_DB: immich_companion
    volumes:
      - companion-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname=$${POSTGRES_DB} --username=$${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  immich-bootstrap:
    image: immich-companion:test
    command: ["python", "-m", "companion.test_bootstrap"]
    user: "0:0"
    environment:
      IMMICH_URL: http://immich-server:2283
      IMMICH_TEST_ADMIN_EMAIL: companion-test@example.invalid
      IMMICH_TEST_ADMIN_PASSWORD: ${IMMICH_TEST_ADMIN_PASSWORD:?Run scripts/test-env.sh to create local test configuration}
      IMMICH_TEST_ADMIN_NAME: Companion Test Admin
      IMMICH_API_KEY_FILE: /run/immich-companion/immich-api-key
      COMPANION_TEST_STATE_FILE: /run/immich-companion/bootstrap-state.json
      COMPANION_TEST_SEED_DIR: /seed
      COMPANION_TEST_RESET_MODE: ${COMPANION_TEST_RESET_MODE:-false}
    volumes:
      - companion-test-state:/run/immich-companion
      - ../generated_dataset/immich-seed:/seed:ro
    depends_on:
      - immich-server
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: "no"

  companion:
    image: immich-companion:test
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      COMPANION_ENV: test
      COMPANION_VERSION: local-test
      IMMICH_URL: http://immich-server:2283
      IMMICH_PUBLIC_URL: http://localhost:${IMMICH_TEST_PORT:-22830}
      IMMICH_API_KEY_FILE: /run/immich-companion/immich-api-key
      IMMICH_TIMEOUT_SECONDS: "5"
      SYNC_BATCH_SIZE: "25"
      SYNC_OVERLAP_SECONDS: "300"
      SYNC_LEASE_SECONDS: "60"
      COMPANION_DATABASE_URL: postgresql://companion:${COMPANION_DB_PASSWORD}@companion-database:5432/immich_companion
      DATABASE_TIMEOUT_SECONDS: "5"
      COMPANION_TEST_STATE_FILE: /run/immich-companion/bootstrap-state.json
      ALLOW_DESTRUCTIVE_ACTIONS: "true"
    volumes:
      - companion-test-state:/run/immich-companion:ro
    ports:
      - "${COMPANION_TEST_BIND:-0.0.0.0}:${COMPANION_TEST_PORT:-8090}:8080"
    depends_on:
      immich-server:
        condition: service_healthy
      companion-database:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  immich-model-cache:
  immich-postgres:
  immich-upload:
  companion-postgres:
  companion-test-state:
