version: "3.8"

services:
  companion:
    working_dir: /workspace/backend
    command:
      - uvicorn
      - companion.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --no-access-log
      - --reload
      - --reload-dir
      - /workspace/backend/companion
    volumes:
      - ../backend:/workspace/backend:ro
