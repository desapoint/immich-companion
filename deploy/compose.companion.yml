version: "3.8"

services:
  immich-companion-database:
    image: docker.io/library/postgres:16.15-alpine3.24
    container_name: immich_companion_database
    environment:
      POSTGRES_PASSWORD: ${IMMICH_COMPANION_DB_PASSWORD}
      POSTGRES_USER: companion
      POSTGRES_DB: immich_companion
    volumes:
      - immich-companion-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname=$${POSTGRES_DB} --username=$${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  immich-companion:
    image: ghcr.io/desapoint/immich-companion:${IMMICH_COMPANION_VERSION:-latest}
    container_name: immich_companion
    mem_limit: ${IMMICH_COMPANION_MEMORY_LIMIT:-1g}
    mem_reservation: ${IMMICH_COMPANION_MEMORY_RESERVATION:-256m}
    environment:
      COMPANION_ENV: production
      COMPANION_VERSION: ${IMMICH_COMPANION_VERSION:-latest}
      IMMICH_URL: http://tailscale:2283
      IMMICH_PUBLIC_URL: ${IMMICH_COMPANION_PUBLIC_IMMICH_URL}
      IMMICH_API_KEY: ${COMPANION_IMMICH_API_KEY}
      IMMICH_TIMEOUT_SECONDS: "5"
      SYNC_BATCH_SIZE: ${IMMICH_COMPANION_SYNC_BATCH_SIZE:-250}
      SYNC_OVERLAP_SECONDS: ${IMMICH_COMPANION_SYNC_OVERLAP_SECONDS:-300}
      SYNC_LEASE_SECONDS: ${IMMICH_COMPANION_SYNC_LEASE_SECONDS:-60}
      SYNC_INCREMENTAL_INTERVAL_SECONDS: ${IMMICH_COMPANION_SYNC_INCREMENTAL_INTERVAL_SECONDS:-300}
      SYNC_FULL_INTERVAL_SECONDS: ${IMMICH_COMPANION_SYNC_FULL_INTERVAL_SECONDS:-86400}
      SYNC_FULL_BATCH_SIZE: ${IMMICH_COMPANION_SYNC_FULL_BATCH_SIZE:-50}
      SYNC_FULL_MIN_BATCH_DELAY_SECONDS: ${IMMICH_COMPANION_SYNC_FULL_MIN_BATCH_DELAY_SECONDS:-0.2}
      SYNC_MEDIA_PAGE_SIZE: ${IMMICH_COMPANION_SYNC_MEDIA_PAGE_SIZE:-1000}
      SYNC_RELATIONSHIP_PAGE_SIZE: ${IMMICH_COMPANION_SYNC_RELATIONSHIP_PAGE_SIZE:-1000}
      SYNC_MAX_ATTEMPTS: ${IMMICH_COMPANION_SYNC_MAX_ATTEMPTS:-5}
      SYNC_RETRY_BACKOFF_SECONDS: ${IMMICH_COMPANION_SYNC_RETRY_BACKOFF_SECONDS:-1}
      SYNC_MEMORY_DIAGNOSTICS: ${IMMICH_COMPANION_SYNC_MEMORY_DIAGNOSTICS:-false}
      COMPANION_DATABASE_URL: postgresql://companion:${IMMICH_COMPANION_DB_PASSWORD}@immich-companion-database:5432/immich_companion
      DATABASE_TIMEOUT_SECONDS: "5"
      ALLOW_DESTRUCTIVE_ACTIONS: "false"
      ACTION_MAX_TARGETS: "5000"
      ACTION_PLAN_TTL_SECONDS: "900"
    ports:
      - "${IMMICH_COMPANION_PORT:-8090}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      immich-companion-database:
        condition: service_healthy
    restart: unless-stopped

volumes:
  immich-companion-postgres:
