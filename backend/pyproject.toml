[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "immich-companion"
version = "0.1.0"
description = "API-first operational companion for Immich"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "croniter>=3,<7",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pillow>=11,<13",
  "pillow-heif>=1,<2",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "rawpy>=0.27,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.32,<1",
  "websockets>=13,<16",
]

[project.optional-dependencies]
dev = [
  "pytest-asyncio>=0.24,<1",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["companion*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"companion/duplicate_service.py" = ["E501"]
"companion/integrity_repository.py" = ["E501"]
"companion/integrity_service.py" = ["E501"]
